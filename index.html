      const wireViewOnly = () => {
        // Per-chapter delete
        el.querySelectorAll('.ch-delete').forEach(btn => btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const cid = btn.dataset.cid;
          const c = chs.find(x => x.id === cid);
          if (!c) return;
          if (!confirm(`Delete chapter "${c.title}"? Its translations + audio + bookmarks are removed. Vocab stays. Cannot be undone.`)) return;
          await Storage.chapters.delete(cid);
          // Purge audio blobs for this chapter
          try {
            const lru = (await LF_AUDIO.getItem('__lru__')) || [];
            const keep = [];
            for (const entry of lru) {
              if (entry.key.startsWith(cid + ':')) await LF_AUDIO.removeItem(entry.key);
              else keep.push(entry);
            }
            await LF_AUDIO.setItem('__lru__', keep);
          } catch {}
          // Reload book detail
          nav('book', { id });
        }));
        // Per-chapter inline rename
        el.querySelectorAll('.ch-rename').forEach(btn => btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const cid = btn.dataset.cid;
          const li = el.querySelector(`li[data-cid="${cid}"]`);
          const titleSpan = li?.querySelector('.ch-title');
          if (!titleSpan) return;
          titleSpan.setAttribute('contenteditable', 'true');
          titleSpan.focus();
          // Select all text
          const range = document.createRange();
          range.selectNodeContents(titleSpan);
          const sel = window.getSelection();
          sel.removeAllRanges(); sel.addRange(range);
          const commit = async () => {
            const newTitle = titleSpan.textContent.trim();
            titleSpan.setAttribute('contenteditable', 'false');
            titleSpan.removeEventListener('keydown', keyH);
            titleSpan.removeEventListener('blur', commit);
            if (newTitle && newTitle !== chs.find(c => c.id === cid).title) {
              const stored = await Storage.chapters.get(cid);
              stored.title = newTitle;
              await Storage.chapters.put({ ...stored, sourceText: stored.sourceText });
            } else {
              titleSpan.textContent = chs.find(c => c.id === cid).title;
            }
          };
          const keyH = (ev) => {
            if (ev.key === 'Enter') { ev.preventDefault(); titleSpan.blur(); }
            if (ev.key === 'Escape') { titleSpan.textContent = chs.find(c => c.id === cid).title; titleSpan.blur(); }
          };
          titleSpan.addEventListener('keydown', keyH);
          titleSpan.addEventListener('blur', commit);
        }));
        // Bookmark item click → open reader at that sentence
        el.querySelectorAll('.bookmarks-list li').forEach(li => li.addEventListener('click', () => {
          nav('reader', { chapterId: li.dataset.cid });
          // Note: reader route doesn't currently accept a sentIdx to auto-scroll — leaving that as gentle nav.
        }));
        // Glossary editor
        const rows = el.querySelector('#glossary-rows');
        el.querySelector('#btn-add-term')?.addEventListener('click', () => {
          const idx = rows.children.length;
          const div = document.createElement('div');
          div.className = 'glossary-list';
          div.dataset.idx = idx;
          div.innerHTML = `
            <input class="g-term" placeholder="${escapeHtml(book.sourceLang.toUpperCase())} term">
            <input class="g-trans" placeholder="Target-lang equivalent">
            <button class="del-term" data-idx="${idx}">&#10005;</button>`;
          rows.appendChild(div);
          div.querySelector('.del-term').addEventListener('click', () => div.remove());
          div.querySelector('.g-term').focus();
        });
        rows.querySelectorAll('.del-term').forEach(btn => btn.addEventListener('click', (ev) => {
          ev.target.closest('.glossary-list').remove();
        }));
        el.querySelector('#btn-save-glossary')?.addEventListener('click', async () => {
          const status = el.querySelector('#glossary-status');
          const newGloss = [];
          rows.querySelectorAll('.glossary-list').forEach(row => {
            const t = row.querySelector('.g-term').value.trim();
            const tr = row.querySelector('.g-trans').value.trim();
            if (t && tr) newGloss.push({ term: t, translation: tr });
          });
          book.glossary = newGloss;
          await Storage.books.put(book);
          status.textContent = `Saved ${newGloss.length} terms.`;
          setTimeout(() => { status.textContent = ''; }, 2500);
        });
      };

      const showView = () => {
        el.innerHTML = renderView();
        wireCommon();
        wireViewOnly();
        el.querySelector('#btn-edit-book').addEventListener('click', showEdit);
      };
      const showEdit = () => {
        el.innerHTML = renderEdit();
        wireCommon();
        const titleInput = el.querySelector('#edit-title');
        const authorInput = el.querySelector('#edit-author');
        const descInput = el.querySelector('#edit-description');
        titleInput.focus();
        titleInput.select();
        const cancel = () => showView();
        const save = async () => {
          const newTitle = titleInput.value.trim();
          if (!newTitle) { alert('Title cannot be empty'); titleInput.focus(); return; }
          const newAuthor = authorInput.value.trim();
          const newDescription = descInput.value.trim();
          // Mutate + persist. Note: chapterCount / chapters are preserved (put doesn't touch chapter data).
          book.title = newTitle;
          book.author = newAuthor;
          book.description = newDescription;
          await Storage.books.put(book);
          showView();
        };
        el.querySelector('#btn-cancel-edit').addEventListener('click', cancel);
        el.querySelector('#btn-save-book').addEventListener('click', save);
        // Keyboard: Enter on title/author saves; Esc cancels
        [titleInput, authorInput].forEach(inp => inp.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); save(); }
          if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
        }));
        descInput.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
        });
      };

      if (edit) showEdit(); else showView();
    });

    // ============ Translation generator (any target language) ============
    // Resumable + incremental-save: if a partial translation exists, resume from where it stopped.
    // Saves every SAVE_EVERY paragraphs so a mid-run error doesn't lose progress.
    // targetLang: 'es'|'en'|'ru'|'pt'   level: 'A2'|'B1'|'B2'|'C1' (only used for 'es')
    async function generateTranslation(chapter, book, targetLang, level, onProgress) {
      const SAVE_EVERY = 5;
      const source = chapter.sourceText || chapter.versions?.[book.sourceLang];
      if (!source) throw new Error('no source text');
      if (targetLang === book.sourceLang) throw new Error('cannot translate to source language');
      const paras = splitParagraphs(source);

      // Resume: read existing partial for THIS target lang (+level for es)
      const existing = targetLang === 'es'
        ? chapter.versions?.es?.[level]
        : chapter.versions?.[targetLang];
      const existingParas = existing ? splitParagraphs(existing) : [];
      const out = [...existingParas];
      const startAt = existingParas.length;

      const saveProgress = async () => {
        const updated = await Storage.chapters.get(chapter.id);
        if (!updated) return;
        updated.versions = updated.versions || {};
        if (targetLang === 'es') {
          updated.versions.es = { ...(updated.versions.es || {}), [level]: out.join('\n\n') };
        } else {
          updated.versions[targetLang] = out.join('\n\n');
        }
        await Storage.chapters.put({ ...updated, sourceText: source });
      };

      for (let i = startAt; i < paras.length; i++) {
        onProgress?.(i, paras.length);
        try {
          const r = await fetch('/api/llm', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              task: 'translate_chunk',
              input: {
                text: paras[i],
                targetLang,
                level: targetLang === 'es' ? level : undefined,
                prevContext: paras[i-1] || undefined,
                nextContext: paras[i+1] || undefined
              },
              glossary: book.glossary || [],
              bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
            })
          });
          let j = null;
          try { j = await r.json(); } catch {}
          if (!r.ok || !j?.result || typeof j.result.text !== 'string') {
            const detail = j?.error || j?.detail || `HTTP ${r.status}`;
            console.warn(`[generateTranslation:${targetLang}] para ${i} failed: ${detail} — placeholder`);
            out.push(`[⚠ para ${i+1} untranslated — click Generate again to retry]\n\n${paras[i]}`);
          } else {
            out.push(j.result.text);
          }
        } catch (netErr) {
          console.warn(`[generateTranslation:${targetLang}] para ${i} network error: ${netErr.message}`);
          out.push(`[⚠ para ${i+1} network error — click Generate again to retry]\n\n${paras[i]}`);
        }
        if ((i + 1) % SAVE_EVERY === 0) await saveProgress();
      }
      onProgress?.(paras.length, paras.length);
      await saveProgress();
      return out.join('\n\n');
    }

    // ============ Reader screen ============
    function renderSentence(s, i) {
      const parts = s.split(/(\s+)/); // preserve whitespace
      const wrapped = parts.map(p => /^\s+$/.test(p) ? p : `<span class="w">${escapeHtml(p)}</span>`).join('');
      return `<span class="sent" data-sent="${i}">${wrapped}</span>`;
    }

    route('reader', async (el, { chapterId, autoplay }) => {
      const readerAbort = new AbortController();
      _currentRouteAbort = readerAbort;

      const ch = await Storage.chapters.get(chapterId);
      const book = await Storage.books.get(ch.bookId);
      const displayLang = await Storage.settings.get('displayLang:' + book.id, book.sourceLang);
      const level = await Storage.settings.get('level:' + book.id, 'B1');

      // Pick text body for the currently displayed language
      let body;
      if (displayLang === 'es') body = ch.versions?.es?.[level] || null;
      else body = ch.versions?.[displayLang] || null;

      const isSourceLang = displayLang === book.sourceLang;
      const LANG_NAMES = { ru: 'Russian', en: 'English', pt: 'Portuguese', es: 'Spanish' };
      const langLabelFull = displayLang === 'es' ? `Spanish (${level})` : (LANG_NAMES[displayLang] || displayLang.toUpperCase());

      // Compute which languages already have content for THIS chapter → visual hint on pills.
      const langHasContent = {
        ru: !!ch.versions?.ru,
        en: !!ch.versions?.en,
        pt: !!ch.versions?.pt,
        es: !!(ch.versions?.es && Object.keys(ch.versions.es).length)
      };
      const availableLangs = Object.entries(langHasContent).filter(([_, v]) => v).map(([k]) => k);

      let sIdx = 0;
      // Available-languages line for the empty state
      const availableLangsChip = availableLangs.length
        ? `<p class="lang-availability">Already generated for this chapter: ${availableLangs.map(l =>
            `<span class="lang-chip-mini">${l === 'es' ? 'ES ' + Object.keys(ch.versions?.es || {}).join('/') : l.toUpperCase()}</span>`
          ).join(' ')}</p>`
        : '';
      const paragraphsHtml = body
        ? splitParagraphs(body).map(p =>
            `<p>${splitSentences(p).map(s => renderSentence(s, sIdx++)).join(' ')}</p>`
          ).join('')
        : `<div class="empty">
             <p class="empty-title">No <b>${escapeHtml(langLabelFull)}</b> yet for this chapter.</p>
             ${availableLangsChip}
             ${isSourceLang
               ? `<p><i>This is the source language — the original text should already be here. Try re-importing the book.</i></p>`
               : `<button id="btn-generate" class="cta-generate">Generate ${escapeHtml(langLabelFull)}</button>
                  <div id="gen-progress"></div>
                  <p class="hint"><small>Paragraph-by-paragraph LLM translation from ${escapeHtml(LANG_NAMES[book.sourceLang] || book.sourceLang)}. Saves incrementally to your browser (IndexedDB). Resumable on errors. Once generated, re-reading costs zero. Swap freely between any generated language via the ${['RU','EN','ES','PT'].join(' / ')} pills above.</small></p>`}
           </div>`;

      // Find prev/next chapter for chapter-nav buttons
      const allChs = await Storage.chapters.list(book.id);
      const chPos = allChs.findIndex(c => c.id === chapterId);
      const prevCh = chPos > 0 ? allChs[chPos - 1] : null;
      const nextCh = chPos >= 0 && chPos < allChs.length - 1 ? allChs[chPos + 1] : null;

      // Load user prefs for loop + continuous
      const loopMode = await Storage.settings.get('loopMode', 'off');
      const continuous = await Storage.settings.get('continuous', false);
      Player.setLoopMode(loopMode);
      Player.setContinuous(continuous);
      const showNums = window.__prefsShowNums || await Storage.settings.get('setting:showSentenceNumbers', false);

      // Compute which sentence indices are bookmarked in this chapter
      const bookmarks = ch.bookmarks || [];
      const bmSet = new Set(bookmarks.map(b => b.sentIdx));

      // Re-render paragraphs with bookmark class applied
      const paragraphsHtmlWithBookmarks = body
        ? (() => {
            let idx = 0;
            return splitParagraphs(body).map(p =>
              `<p>${splitSentences(p).map(s => {
                const cls = bmSet.has(idx) ? 'sent bookmarked' : 'sent';
                const rendered = `<span class="${cls}" data-sent="${idx}">${s.split(/(\s+)/).map(part => /^\s+$/.test(part) ? part : `<span class="w">${escapeHtml(part)}</span>`).join('')}</span>`;
                idx++;
                return rendered;
              }).join(' ')}</p>`
            ).join('');
          })()
        : paragraphsHtml;

      el.innerHTML = `
        <header class="topbar reader-topbar">
          <button id="btn-back-book" title="Back to book">&#8592;</button>
          <button class="pc-btn prev-ch-btn" title="Previous chapter" ${prevCh ? '' : 'disabled'}>&laquo;</button>
          <div class="crumbs">${escapeHtml(book.title)} &middot; ${escapeHtml(ch.title)}</div>
          <button class="pc-btn next-ch-btn" title="Next chapter" ${nextCh ? '' : 'disabled'}>&raquo;</button>
          <div class="pills lang-pills">
            ${['ru','en','es','pt'].map(l => `<button data-lang="${l}" class="pill${l === displayLang ? ' active' : ''}${langHasContent[l] ? ' has-content' : ''}" title="${langHasContent[l] ? 'Has translated text' : (l === book.sourceLang ? 'Source language' : 'Not translated yet — click to generate')}">${l.toUpperCase()}${langHasContent[l] ? '<span class="pill-dot">&bull;</span>' : ''}</button>`).join('')}
          </div>
          <div class="pills level-pills"${displayLang === 'es' ? '' : ' hidden'}>
            ${['A2','B1','B2','C1'].map(lv => `<button data-level="${lv}" class="pill${lv === level ? ' active' : ''}">${lv}</button>`).join('')}
          </div>
          <div class="player-controls">
            <button class="pc-btn prev-btn" title="Previous sentence (J or ←)">&#9198;</button>
            <button class="pc-btn play-btn" title="Play / Pause (Space)">&#9654;</button>
            <button class="pc-btn stop-btn" title="Stop (Esc)">&#9724;</button>
            <button class="pc-btn next-btn" title="Next sentence (K or →)">&#9197;</button>
            <button class="pc-btn loop-btn ${loopMode === 'sentence' ? 'loop-sent' : loopMode === 'paragraph' ? 'loop-para' : ''}" title="Loop mode (L to cycle): off/sentence/paragraph">${loopMode === 'sentence' ? '&#128257;s' : loopMode === 'paragraph' ? '&#128257;p' : '&#128256;'}</button>
            <button class="pc-btn continuous-btn ${continuous ? 'active-toggle' : ''}" title="Continuous cross-chapter play">${continuous ? '&#10148;&#10148;' : '&#10148;'}</button>
            <select class="speed" title="Playback speed">
              <option value="0.75">0.75&times;</option>
              <option value="1" selected>1&times;</option>
              <option value="1.25">1.25&times;</option>
              <option value="1.5">1.5&times;</option>
            </select>
          </div>
        </header>
        <div class="reader-progress"><div class="reader-progress-fill" id="reader-progress-fill"></div></div>
        <main class="reader ${showNums ? 'show-sent-nums' : ''}">${paragraphsHtmlWithBookmarks}<div id="popover" hidden></div></main>`;

      el.querySelector('#btn-back-book').addEventListener('click', () => nav('book', { id: book.id }));
      el.querySelectorAll('.lang-pills .pill').forEach(p => p.addEventListener('click', async () => {
        await Storage.settings.set('displayLang:' + book.id, p.dataset.lang);
        nav('reader', { chapterId });
      }));
      el.querySelectorAll('.level-pills .pill').forEach(p => p.addEventListener('click', async () => {
        await Storage.settings.set('level:' + book.id, p.dataset.level);
        nav('reader', { chapterId });
      }));

      // Generate button — works for ANY non-source target language, with cost preview
      document.getElementById('btn-generate')?.addEventListener('click', async (e) => {
        const source = ch.sourceText || ch.versions?.[book.sourceLang] || '';
        const cost = estimateTranslateCost(source);
        const bodyHtml = `Translate this chapter to <b>${escapeHtml(langLabelFull)}</b>?<br><br>
          Chapter length: <b>${cost.chars.toLocaleString()} chars</b><br>
          Estimated input tokens: ~${cost.inputToks.toLocaleString()}<br>
          Estimated output tokens: ~${cost.outputToks.toLocaleString()}<br>
          Estimated LLM cost: <b>~$${cost.usd.toFixed(3)}</b> (Sonnet 4.6)<br><br>
          <small>Saves incrementally, resumable on errors. Once done, re-reading is free.</small>`;
        const ok = await confirmCost(`Generate ${langLabelFull}?`, bodyHtml, `Generate (~$${cost.usd.toFixed(3)})`);
        if (!ok) return;
        e.target.disabled = true;
        const prog = document.getElementById('gen-progress');
        try {
          await generateTranslation(ch, book, displayLang, level, (done, total) => {
            prog.textContent = `Translating paragraph ${done} / ${total}...`;
          });
          nav('reader', { chapterId });
        } catch (err) {
          prog.textContent = 'Error: ' + escapeHtml(err.message);
          e.target.disabled = false;
        }
      });

      // ---- Voice this chapter button (per-language) ----
      // Voice-key depends on displayLang: es_${level} or ru/en
      const currentKey = voiceKey(displayLang, level);
      const langLabel = displayLang === 'es' ? `ES ${level}` : displayLang.toUpperCase();
      if (body && !ch.voiced?.[currentKey]) {
        const voiceBtn = document.createElement('button');
        voiceBtn.textContent = `🎙 Voice this chapter (${langLabel})`;
        voiceBtn.className = 'voice-btn';
        el.querySelector('.reader-topbar').appendChild(voiceBtn);
        voiceBtn.addEventListener('click', async () => {
          const cost = estimateVoiceCost(body || '');
          const bodyHtml = `Voice this chapter in <b>${escapeHtml(langLabelFull)}</b>?<br><br>
            Chapter length: <b>${cost.chars.toLocaleString()} chars</b><br>
            Estimated ElevenLabs credits: <b>~${cost.credits.toLocaleString()}</b><br>
            Estimated cost (Creator tier): <b>~$${cost.usdApprox.toFixed(2)}</b><br><br>
            <small>One-time cost. Audio + word timings cached locally forever.</small>`;
          const ok = await confirmCost(`Voice this chapter?`, bodyHtml, `Voice (~$${cost.usdApprox.toFixed(2)})`);
          if (!ok) return;
          voiceBtn.disabled = true;
          voiceBtn.textContent = 'Voicing…';
          try {
            await voiceChapter(ch, book, displayLang, level, (d, t) => {
              voiceBtn.textContent = `Voicing ${Math.round(100 * d / t)}% (${d}/${t})`;
            });
            nav('reader', { chapterId });
          } catch (err) {
            voiceBtn.disabled = false;
            voiceBtn.textContent = 'Error: ' + err.message;
          }
        });
      }

      // ---- RWL: Full player controls (prev / play-pause / stop / next / speed) ----
      const playBtn = el.querySelector('.play-btn');
      const prevBtn = el.querySelector('.prev-btn');
      const nextBtn = el.querySelector('.next-btn');
      const stopBtn = el.querySelector('.stop-btn');
      const isVoiced = !!ch.voiced?.[currentKey];
      [playBtn, prevBtn, nextBtn, stopBtn].forEach(b => { b.disabled = !isVoiced; });
      playBtn.title = isVoiced ? `Play ${langLabel} from position` : `Voice this chapter in ${langLabel} first`;

      const syncPlayBtn = () => {
        setTimeout(() => { playBtn.innerHTML = Player.isPlaying() ? '&#10074;&#10074;' : '&#9654;'; }, 100);
      };

      playBtn.addEventListener('click', () => {
        if (Player.isPlaying()) { Player.pause(); playBtn.innerHTML = '&#9654;'; return; }
        if (Player.audioEl) { Player.resume(); playBtn.innerHTML = '&#10074;&#10074;'; return; }
        const resume = ch.playbackResume;
        const startIdx = (resume && resume.key === currentKey) ? resume.sentenceIndex : 0;
        Player.start(ch, book, displayLang, level, startIdx);
        syncPlayBtn();
      });
      prevBtn.addEventListener('click', () => {
        if (!Player.audioEl) {
          // Not started yet — start playback from beginning
          Player.start(ch, book, displayLang, level, 0);
        } else {
          Player.prev();
        }
        syncPlayBtn();
      });
      nextBtn.addEventListener('click', () => {
        if (!Player.audioEl) {
          Player.start(ch, book, displayLang, level, 0);
        } else {
          Player.skipNext();
        }
        syncPlayBtn();
      });
      stopBtn.addEventListener('click', () => { Player.stop(); playBtn.innerHTML = '&#9654;'; updateProgress(0, 1); });

      el.querySelector('.speed').value = Player.speed;
      el.querySelector('.speed').addEventListener('change', (e) => Player.setSpeed(parseFloat(e.target.value)));

      // ---- Progress bar ----
      const progressFill = el.querySelector('#reader-progress-fill');
      function updateProgress(idx, total) {
        if (!progressFill) return;
        // Represent "current position" — sentence idx (0-based) plus 1 divided by total
        // so first sentence playing shows immediate visible progress (e.g. 1/4 = 25%)
        const pct = total ? ((idx + 1) / total) * 100 : 0;
        progressFill.style.width = Math.min(100, pct).toFixed(1) + '%';
      }
      // Initial: use chapter positionFraction (already 0..1)
      if (progressFill) progressFill.style.width = ((ch.positionFraction || 0) * 100).toFixed(1) + '%';
      Player.progressCb = (idx, total) => updateProgress(idx, total);

      // ---- Loop button (cycles off → sentence → paragraph → off) ----
      const loopBtn = el.querySelector('.loop-btn');
      loopBtn.addEventListener('click', async () => {
        const cycle = { off: 'sentence', sentence: 'paragraph', paragraph: 'off' };
        const newMode = cycle[Player.loopMode] || 'off';
        Player.setLoopMode(newMode);
        await Storage.settings.set('loopMode', newMode);
        loopBtn.classList.remove('loop-sent', 'loop-para');
        if (newMode === 'sentence') { loopBtn.classList.add('loop-sent'); loopBtn.innerHTML = '&#128257;s'; }
        else if (newMode === 'paragraph') { loopBtn.classList.add('loop-para'); loopBtn.innerHTML = '&#128257;p'; }
        else { loopBtn.innerHTML = '&#128256;'; }
      });

      // ---- Continuous cross-chapter toggle ----
      const contBtn = el.querySelector('.continuous-btn');
      contBtn.addEventListener('click', async () => {
        const newVal = !Player.continuous;
        Player.setContinuous(newVal);
        await Storage.settings.set('continuous', newVal);
        contBtn.classList.toggle('active-toggle', newVal);
        contBtn.innerHTML = newVal ? '&#10148;&#10148;' : '&#10148;';
      });

      // ---- Chapter navigation buttons ----
      const prevChBtn = el.querySelector('.prev-ch-btn');
      const nextChBtn = el.querySelector('.next-ch-btn');
      prevChBtn.addEventListener('click', () => {
        if (prevCh) nav('reader', { chapterId: prevCh.id });
      });
      nextChBtn.addEventListener('click', () => {
        if (nextCh) nav('reader', { chapterId: nextCh.id });
      });

      // ---- Continuous cross-chapter auto-advance ----
      // When Player finishes the last sentence AND continuous=true, jump to next chapter and resume RWL there.
      Player.chapterEndCb = async () => {
        if (!Player.continuous) return;
        if (!nextCh) return;
        // Save current chapter position as fully-read (positionFraction = 1)
        try {
          const stored = await Storage.chapters.get(chapterId);
          if (stored) {
            stored.positionFraction = 1;
            await Storage.chapters.put({ ...stored, sourceText: stored.sourceText });
          }
        } catch {}
        // Navigate — the new reader render will pick up Player state
        nav('reader', { chapterId: nextCh.id, autoplay: true });
      };

      // If we got here via autoplay from previous chapter, kick off playback automatically.
      if (autoplay && isVoiced) {
        setTimeout(() => {
          Player.start(ch, book, displayLang, level, 0);
          syncPlayBtn();
        }, 300);
      }

      // ---- Keyboard shortcuts ----
      // Space: toggle play/pause · J: next · K: prev · L: cycle loop mode · Esc: stop · [ / ]: prev/next chapter
      // Arrow keys also supported (← prev, → next). Ignored when focus is in an input.
      const keyHandler = (ev) => {
        const target = ev.target;
        const inField = target?.tagName === 'INPUT' || target?.tagName === 'TEXTAREA' || target?.isContentEditable;
        if (inField) return;
        if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
        switch (ev.key) {
          case ' ': ev.preventDefault(); playBtn.click(); break;
          case 'j': case 'J': case 'ArrowRight': ev.preventDefault(); nextBtn.click(); break;
          case 'k': case 'K': case 'ArrowLeft': ev.preventDefault(); prevBtn.click(); break;
          case 'l': case 'L': ev.preventDefault(); loopBtn.click(); break;
          case 'Escape': ev.preventDefault(); stopBtn.click(); break;
          case '[': ev.preventDefault(); prevChBtn.click(); break;
          case ']': ev.preventDefault(); nextChBtn.click(); break;
          default: return;
        }
      };
      document.addEventListener('keydown', keyHandler, { signal: readerAbort.signal });

      // ---- Alt+click on a sentence plays RWL from that sentence ----
      el.querySelector('main.reader').addEventListener('click', (e) => {
        if (!e.altKey) return;
        const sent = e.target.closest('.sent');
        if (!sent) return;
        const idx = parseInt(sent.dataset.sent);
        Player.start(ch, book, displayLang, level, idx);
        syncPlayBtn();
      });

      // ---- Alt+click on a paragraph (empty area) plays from its first sentence ----
      // Paragraphs are <p>; sentences are .sent inside <p>. Detect click on <p> where target isn't a sentence.
      el.querySelector('main.reader').addEventListener('click', (e) => {
        if (!e.altKey) return;
        if (e.target.closest('.sent')) return;   // already handled above
        const p = e.target.closest('main.reader p');
        if (!p) return;
        const firstSent = p.querySelector('.sent');
        if (!firstSent) return;
        const idx = parseInt(firstSent.dataset.sent);

        syncPlayBtn();

      // ---- Shift+click speaks sentence (ephemeral Flash, in displayLang's voice) ----
      el.querySelector('main.reader').addEventListener('click', async (e) => {

        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            text: sent.textContent.trim(),
            model: 'flash_v2_5',
            voice: 'narrator',
            lang: displayLang,
            withTimestamps: false
          })
        });
        if (!r.ok) return alert('TTS error');
        const blob = await r.blob();
        new Audio(URL.createObjectURL(blob)).play();
      });

      el.querySelector('main.reader').addEventListener('click', (e) => {

      // ---- Tap-to-gloss ----

        el.querySelector('main.reader').addEventListener('click', async (e) => {
          if (e.altKey) return;
          if (e.shiftKey) return;
          if (e.ctrlKey) return;
          if (e.detail > 1) return;   // suppress double-click's first click
          const w = e.target.closest('.w');
          if (!w) { pop.hidden = true; return; }
          const sent = w.closest('.sent');
          const word = w.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').trim();
          if (!word) return;
          const sentence = sent.textContent.trim();
          pop.hidden = false;
          pop.innerHTML = `<div class="pop-loading">Looking up &#8220;${escapeHtml(word)}&#8221;&#8230;</div>`;
          const rect = w.getBoundingClientRect();
          // Position popover viewport-relative (position: fixed).
          // Prefer below the word, but flip above if not enough room, then clamp to viewport.
          const POP_MAX_H = Math.min(window.innerHeight * 0.8, 400);
          const POP_W = 320;
          const spaceBelow = window.innerHeight - rect.bottom;
          const spaceAbove = rect.top;
          const preferAbove = spaceBelow < POP_MAX_H && spaceAbove > spaceBelow;
          pop.style.left = Math.max(8, Math.min(window.innerWidth - POP_W - 8, rect.left)) + 'px';
          if (preferAbove) {
            pop.style.top = Math.max(8, rect.top - POP_MAX_H - 6) + 'px';
          } else {
            pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - POP_MAX_H - 8) + 'px';
          }

          try {
            const r = await fetch('/api/llm', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                task: 'gloss',
                input: { tappedWord: word, sentence, displayLang },
                glossary: book.glossary || [],
                bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
              })
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
            const g = j.result;
            // Compute jump indices for RWL play-from-here
            const sentIdx = parseInt(sent.dataset.sent, 10);
            const paraEl = w.closest('main.reader p');
            const firstSentInPara = paraEl?.querySelector('.sent');
            const paraFirstIdx = firstSentInPara ? parseInt(firstSentInPara.dataset.sent, 10) : sentIdx;
            const isVoiced = !!ch.voiced?.[currentKey];
            pop.innerHTML = `
              <div class="pop-word"><b>${escapeHtml(g.word)}</b> <span class="pop-lemma">(${escapeHtml(g.lemma)})</span></div>

              <div class="pop-play-row">

                <button id="pop-jump-sent" title="Play from this sentence with highlights (RWL)"${isVoiced ? '' : ' disabled'}>&#9654; from here</button>
                <button id="pop-jump-para" title="Play from this paragraph with highlights (RWL)"${isVoiced ? '' : ' disabled'}>&#9654; paragraph</button>
              </div>
              ${isVoiced ? '' : '<p class="pop-hint"><small>Voice this chapter to enable ▶ from-here jumps.</small></p>'}
              <div class="pop-actions">
                <button id="pop-save">+ save</button>
                <button id="pop-bookmark" title="Bookmark this sentence — appears in book detail bookmarks list">${bmSet.has(sentIdx) ? '&#128278;' : '&#128279;'}</button>
                <button id="pop-close">✕</button>
              </div>`;
            document.getElementById('pop-save').addEventListener('click', async () => {
              await Storage.vocab.put({
                word: g.word, lemma: g.lemma, gloss: g.gloss, sourceSentence: sentence,
                bookId: book.id, chapterId: ch.id, displayLangAtSave: displayLang, exported: false
              });
              if (!pop.hidden) {
                const btn = document.getElementById('pop-save');
                if (btn) btn.textContent = '✓ saved';
              }

            document.getElementById('pop-bookmark').addEventListener('click', async () => {
              // Toggle bookmark

              if (existing >= 0) {
                stored.bookmarks.splice(existing, 1);
                bmSet.delete(sentIdx);
                sent.classList.remove('bookmarked');
              } else {
                stored.bookmarks.push({ sentIdx, addedAt: Date.now(), snippet: sentence.slice(0, 80) });
                bmSet.add(sentIdx);
                sent.classList.add('bookmarked');

              await Storage.chapters.put({ ...stored, sourceText: stored.sourceText });
              if (!pop.hidden) {
                const btn = document.getElementById('pop-bookmark');
                if (btn) btn.innerHTML = bmSet.has(sentIdx) ? '&#128278;' : '&#128279;';

            document.getElementById('pop-play-word').addEventListener('click', () => {

              playWord(ch.id, sentence, word, currentKey, displayLang);

            document.getElementById('pop-jump-sent').addEventListener('click', () => {
              if (!isVoiced) return;

              Player.start(ch, book, displayLang, level, sentIdx);
              const btn = el.querySelector('.play-btn');
              if (btn) setTimeout(() => { btn.innerHTML = Player.isPlaying() ? '&#10074;&#10074;' : '&#9654;'; }, 100);
            });

            document.getElementById('pop-jump-para').addEventListener('click', () => {

            pop.innerHTML = `<div class="pop-error">${escapeHtml(err.message)}</div>`;

        // Dismiss on outside click only (popover is position:fixed, so scroll doesn't require dismiss)

          const r = await fetch('/api/llm', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              task: 'breakdown',
              input: { sentence, displayLang, l1 },

      const tbody = el.querySelector('#vocab-tbody');

      el.querySelector('#btn-anki-push').addEventListener('click', async () => {
        const status = el.querySelector('#anki-status');
        const url = el.querySelector('#s-ankiurl').value.trim();
        const allVocab = await Storage.vocab.list();
        const unexported = allVocab.filter(v => !v.exported);
        if (!unexported.length) { status.textContent = 'No unexported vocab to push.'; return; }
        status.textContent = `Pushing ${unexported.length} cards…`;
        try {
          const notes = unexported.map(v => ({
            deckName: 'lector',
            modelName: 'Basic',
            fields: {
              Front: v.word,
              Back: `<b>${v.gloss}</b><br><small>${v.sourceSentence}</small>${v.note ? '<br><i>' + v.note + '</i>' : ''}`
            },
            tags: ['lector', 'auto']
          }));
          // Ensure deck exists
          await fetch(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'createDeck', version: 6, params: { deck: 'lector' } })
          });
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'addNotes', version: 6, params: { notes } })
          });
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          const succeeded = (j.result || []).filter(x => x != null).length;
          // Mark them as exported in storage
          for (let i = 0; i < unexported.length; i++) {
            if ((j.result || [])[i] != null) {
              const v = unexported[i];
              v.exported = true;
              await Storage.vocab.put(v);
            }
          }
          status.textContent = `Pushed ${succeeded} / ${unexported.length} cards. Deck "lector" in Anki.`;
        } catch (err) {
          status.textContent = 'Failed: ' + err.message;
        }
      });
      // Backup
      el.querySelector('#btn-backup').addEventListener('click', async () => {
        const status = el.querySelector('#backup-status');
        status.textContent = 'Building backup…';
        try {
          const dump = await exportBackup();
          const blob = new Blob([JSON.stringify(dump)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dt = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `lector-backup-${dt}.json`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          status.textContent = `Downloaded lector-backup-${dt}.json (${dump.books.length} books, ${dump.audio.length} audio blobs)`;
        } catch (err) {
          status.textContent = 'Backup failed: ' + err.message;
        }
      });
      // Restore
      el.querySelector('#restore-file').addEventListener('change', async (e) => {
        const status = el.querySelector('#backup-status');
        const f = e.target.files?.[0];
        if (!f) return;
        if (!confirm('Restore will WIPE all current data and replace with backup content. Continue?')) return;
        status.textContent = 'Reading backup…';
        try {
          const txt = await f.text();
          const dump = JSON.parse(txt);
          status.textContent = 'Restoring…';
          await importBackup(dump);
          status.textContent = 'Restored. Go back to Library.';
        } catch (err) {
          status.textContent = 'Restore failed: ' + err.message;
        }
      });
      // Existing cache buttons
      document.getElementById('btn-evict').addEventListener('click', async () => {
        const freed = await Storage.audio.evictOldest(stats.bytes / 2);
        alert('Freed ' + (freed/1024/1024).toFixed(1) + ' MB');
        nav('settings');
      });
      document.getElementById('btn-wipe').addEventListener('click', async () => {
        if (!confirm('Wipe ALL books, chapters, vocab, and audio? This cannot be undone.')) return;
        await Promise.all([LF_META.clear(), LF_TEXT.clear(), LF_AUDIO.clear()]);
        nav('library');
      });
      el.querySelectorAll('.voice-sel').forEach(sel => sel.addEventListener('change', async (e) => {
        const b = await Storage.books.get(e.target.dataset.book);
        b.narratorVoice = e.target.value;
        await Storage.books.put(b);
      }));
    });

    // ============ Backup / restore helpers ============
    // Serialize the entire IndexedDB (meta + text + audio-with-blobs-as-base64) → JSON dump.
    async function exportBackup() {
      const dump = { version: 1, ts: Date.now(), books: [], chapters: [], text: {}, vocab: [], settings: {}, audio: [] };
      const bookIds = (await LF_META.getItem('books:index')) || [];
      for (const bid of bookIds) {
        const b = await LF_META.getItem(`book:${bid}`);
        if (b) dump.books.push(b);
        const chIdx = (await LF_META.getItem(`chapters:${bid}`)) || [];
        for (const cid of chIdx) {
          const ch = await LF_META.getItem(`chapter:${cid}`);
          if (ch) dump.chapters.push(ch);
        }
        dump.text[`chapters:${bid}`] = chIdx;
      }
      // Text bodies
      await LF_TEXT.iterate((val, key) => { dump.text[key] = val; });
      // Vocab
      const vIds = (await LF_META.getItem('vocab:index')) || [];
      for (const vid of vIds) {
        const v = await LF_META.getItem(`vocab:${vid}`);
        if (v) dump.vocab.push(v);
      }
      // Settings (anything starting with `setting:`)
      await LF_META.iterate((val, key) => {
        if (key.startsWith('setting:')) dump.settings[key] = val;
      });
      // Audio: convert blob → base64
      const lru = (await LF_AUDIO.getItem('__lru__')) || [];
      for (const entry of lru) {
        const rec = await LF_AUDIO.getItem(entry.key);
        if (!rec) continue;
        const b64 = await new Promise((res) => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result.split(',')[1] || '');
          fr.readAsDataURL(rec.blob);
        });
        dump.audio.push({ key: entry.key, base64: b64, timings: rec.timings, size: rec.size, ts: rec.ts });
      }
      return dump;
    }

    async function importBackup(dump) {
      if (!dump || dump.version !== 1) throw new Error('unsupported backup version');
      // Wipe first
      await Promise.all([LF_META.clear(), LF_TEXT.clear(), LF_AUDIO.clear()]);
      // Books + book:index
      await LF_META.setItem('books:index', dump.books.map(b => b.id));
      for (const b of dump.books) await LF_META.setItem(`book:${b.id}`, b);
      // Chapters
      for (const ch of dump.chapters) await LF_META.setItem(`chapter:${ch.id}`, ch);
      // Text bodies + chapter indices
      for (const [key, val] of Object.entries(dump.text)) await LF_TEXT.setItem(key, val);
      // Restore chapters:${bookId} indices from text if present, or from grouping chapters
      for (const b of dump.books) {
        const chIds = dump.chapters.filter(c => c.bookId === b.id).sort((a, c) => a.index - c.index).map(c => c.id);
        await LF_META.setItem(`chapters:${b.id}`, chIds);
      }
      // Vocab
      const vIds = dump.vocab.map(v => v.id);
      await LF_META.setItem('vocab:index', vIds);
      for (const v of dump.vocab) await LF_META.setItem(`vocab:${v.id}`, v);
      // Settings
      for (const [key, val] of Object.entries(dump.settings || {})) await LF_META.setItem(key, val);
      // Audio: decode base64 → blob
      const lru = [];
      for (const a of dump.audio || []) {
        const bin = atob(a.base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'audio/mpeg' });
        await LF_AUDIO.setItem(a.key, { blob, timings: a.timings, size: a.size, ts: a.ts });
        lru.push({ key: a.key, ts: a.ts, size: a.size });
      }
      await LF_AUDIO.setItem('__lru__', lru);
    }
    window.exportBackup = exportBackup;
    window.importBackup = importBackup;

    // ============ Cost estimation helpers ============
    // Anthropic Sonnet 4.6 pricing (Aug 2026): $3/MTok input, $15/MTok output — approximate for translation.
    // ElevenLabs Multilingual v2: 1 credit per char (approx cost per credit varies by tier).
    function estimateTranslateCost(text) {
      const chars = text.length;
      const inputToks = Math.ceil(chars / 3.5);
      const outputToks = Math.ceil(chars / 3.5);   // 1:1 rough
      const inCostUsd = (inputToks / 1e6) * 3;
      const outCostUsd = (outputToks / 1e6) * 15;
      return { chars, inputToks, outputToks, usd: inCostUsd + outCostUsd };
    }
    function estimateVoiceCost(text) {
      const chars = text.length;
      // Rough: 1 credit per char, ~$0.00018/credit on Creator tier — cost varies wildly by tier.
      return { chars, credits: chars, usdApprox: chars * 0.00015 };
    }
    // Show a confirmation modal with cost estimate before running a costly operation.
    // Returns Promise<boolean> — true if user confirmed.
    function confirmCost(title, bodyHtml, actionLabel = 'Continue') {
      return new Promise((resolve) => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `<div class="modal">
          <h3>${escapeHtml(title)}</h3>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-actions">
            <button class="secondary" data-a="cancel">Cancel</button>
            <button class="primary" data-a="ok">${escapeHtml(actionLabel)}</button>
          </div></div>`;
        document.body.appendChild(backdrop);
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) { document.body.removeChild(backdrop); resolve(false); return; }
          const a = e.target.dataset?.a;
          if (a === 'cancel' || a === 'ok') {
            document.body.removeChild(backdrop);
            resolve(a === 'ok');
          }
        });
      });
    }
    window.confirmCost = confirmCost;
    window.estimateTranslateCost = estimateTranslateCost;
    window.estimateVoiceCost = estimateVoiceCost;

    // ============ Mobile long-press sentence menu ============
    (function() {
      let lpTimer = null;

      document.addEventListener('touchstart', function(e) {
        const sent = e.target.closest && e.target.closest('.sent');
        if (!sent) return;
        lpTimer = setTimeout(function() {
          showSentMenu(sent, e.touches[0]);
        }, 600);
      }, { passive: true });

      document.addEventListener('touchend', function() { clearTimeout(lpTimer); });
      document.addEventListener('touchmove', function() { clearTimeout(lpTimer); }, { passive: true });

      function showSentMenu(sentEl, touch) {
        // Remove any existing menu
        const existing = document.querySelector('.sent-menu');
        if (existing) existing.remove();

        const menu = document.createElement('div');
        menu.className = 'sent-menu';
        menu.innerHTML =
          '<button data-a="speak">🔊 Speak</button>' +
          '<button data-a="play">▶ From here</button>' +
          '<button data-a="breakdown">§ Break down</button>' +
          '<button data-a="recite">🎙 Recite</button>';

        const left = Math.min(window.innerWidth - 200, touch.clientX);
        const top = window.scrollY + touch.clientY + 8;
        menu.style.left = Math.max(8, left) + 'px';
        menu.style.top = top + 'px';
        document.body.appendChild(menu);

        function close() { menu.remove(); }

        menu.addEventListener('click', function(e) {
          const a = e.target.dataset && e.target.dataset.a;
          close();
          if (a === 'speak') {
            sentEl.dispatchEvent(new MouseEvent('click', { shiftKey: true, bubbles: true, cancelable: true }));
          } else if (a === 'play') {
            sentEl.dispatchEvent(new MouseEvent('click', { altKey: true, bubbles: true, cancelable: true }));
          } else if (a === 'breakdown') {
            sentEl.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, cancelable: true }));
          } else if (a === 'recite') {
            sentEl.dispatchEvent(new MouseEvent('click', { ctrlKey: true, bubbles: true, cancelable: true }));
          }
        });

        // Close on next outside tap/click
        setTimeout(function() {
          document.addEventListener('click', close, { once: true });
          document.addEventListener('touchstart', close, { once: true });
        }, 0);
      }
    })();

    window.Storage = Storage;
    window.nav = nav;
    window.escapeHtml = escapeHtml;
    nav('library');
  </script>
</body>
