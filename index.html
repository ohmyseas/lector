<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --serif: 'Literata', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;

      /* Colors */
      --fg:      #1a1a1a;
      --fg-muted:#555;
      --bg:      #fafaf8;
      --bg-card: #fff;
      --accent:  #2d6a4f;
      --accent-h:#1b4332;
      --border:  #e4e4e0;

      /* Spacing scale */
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;
      --sp-12: 3rem;

      /* Layout */
      --max-w: 52rem;
      --radius: 10px;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-6);
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .topbar .actions {
      display: flex;
      gap: var(--sp-2);
      align-items: center;
    }

    /* ===== Buttons ===== */
    button {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: var(--sp-2) var(--sp-4);
      transition: background 0.15s, color 0.15s;
    }
    button.primary, #btn-import, #btn-import-2 {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover, #btn-import:hover, #btn-import-2:hover {
      background: var(--accent-h);
    }
    button.ghost {
      background: transparent;
      color: var(--fg-muted);
    }
    button.ghost:hover {
      background: var(--border);
      color: var(--fg);
    }
    #btn-vocab, #btn-settings {
      background: transparent;
      color: var(--fg-muted);
      padding: var(--sp-2) var(--sp-3);
    }
    #btn-vocab:hover, #btn-settings:hover {
      background: var(--border);
      color: var(--fg);
    }

    /* ===== Library grid ===== */
    .library {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
      gap: var(--sp-6);
    }

    /* ===== Book card ===== */
    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .book-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .book-card h2 {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .book-card .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
    }
    .book-card .meta {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: auto;
    }
    .book-card .continue {
      margin-top: var(--sp-4);
      background: var(--accent);
      color: #fff;
      align-self: flex-start;
      padding: var(--sp-2) var(--sp-4);
    }
    .book-card .continue:hover { background: var(--accent-h); }

    /* ===== Empty state ===== */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--sp-12) var(--sp-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-6);
    }
    .empty p {
      font-size: 1.125rem;
      color: var(--fg-muted);
    }
    .empty button {
      font-size: 1rem;
      padding: var(--sp-3) var(--sp-8);
    }

    /* ===== Stub screens ===== */
    .stub {
      max-width: var(--max-w);
      margin: var(--sp-8) auto;
      padding: 0 var(--sp-6);
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .stub button { margin-top: var(--sp-4); }

    /* ===== Book detail ===== */
    .book-detail {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-6);
    }
    .book-detail .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
      margin-top: var(--sp-1);
    }
    .chapters {
      list-style: none;
      margin-top: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .chapters li {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .chapters li:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .ch-idx {
      font-size: 0.75rem;
      color: var(--fg-muted);
      min-width: 1.5rem;
      text-align: right;
    }
    .ch-title {
      flex: 1;
      font-family: var(--serif);
      font-size: 0.95rem;
    }
    .chips {
      display: flex;
      gap: var(--sp-1);
      flex-shrink: 0;
    }
    .chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
    }

    /* ===== Reader ===== */
    .reader-topbar {
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .crumbs {
      flex: 1;
      font-size: 0.875rem;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pills {
      display: flex;
      gap: 4px;
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .pill.active {
      background: var(--accent);
      color: #fff;
    }
    .pill:hover:not(.active) {
      background: #d5e8de;
      color: var(--accent);
    }
    /* .play-btn styles moved to RWL Playback section below */
    .reader {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      font-family: var(--serif);
      font-size: 1.125rem;
      line-height: 1.8;
    }
    .reader p {
      margin-bottom: var(--sp-6);
    }
    .sent {
      border-radius: 3px;
    }
    .sent:hover {
      background: rgba(45,106,79,0.08);
    }
    .reader .empty {
      grid-column: unset;
      text-align: left;
    }
    .reader .empty p {
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .reader .empty button {
      margin-top: var(--sp-4);
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== Word popover ===== */
    #popover { position: absolute; z-index: 100; background: var(--bg); border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 320px; font-family: var(--sans); font-size: 14px; }
    .pop-word { font-size: 16px; margin-bottom: 4px; }
    .pop-lemma { color: #888; font-size: 13px; font-style: italic; }
    .pop-gloss { margin: 8px 0; }
    .pop-note { color: #555; font-size: 13px; }
    .pop-actions { margin-top: 10px; display: flex; gap: 8px; }
    .w { cursor: pointer; }
    .w:hover { background: #fffbe0; }

    /* ===== Breakdown (Frank-style) ===== */
    .breakdown { background: #f7f4ee; border-left: 3px solid #b89b62; padding: 10px 14px; margin: 6px 0 12px; font-family: var(--sans); font-size: 14px; position: relative; }
    .bd-ch { display: inline-block; margin-right: 6px; }
    .bd-g { color: #7a6b48; font-style: italic; font-size: 12px; }
    .bd-clean { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d7c99a; }
    .bd-close { position: absolute; top: 6px; right: 8px; background: transparent; border: 0; cursor: pointer; font-size: 14px; }

    /* ===== Voice button ===== */
    .voice-btn {
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      padding: var(--sp-2) var(--sp-3);
    }
    .voice-btn:hover:not(:disabled) { background: var(--accent-h); }
    .voice-btn:disabled { opacity: 0.6; cursor: default; }

    /* ===== RWL Playback ===== */
    .sent.playing { background: #fff7d0; border-radius: 3px; }
    .wnow { border-bottom: 2px solid var(--accent); }
    .play-btn { font-size: 18px; padding: 4px 12px; background: transparent; color: var(--fg-muted); }
    .play-btn:hover:not(:disabled) { background: var(--border); color: var(--fg); }
    .play-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .speed { font-family: var(--sans); font-size: 0.8rem; padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--fg); cursor: pointer; }

    /* ===== Recite mode ===== */
    .sent.reciting { outline: 2px dashed #b89b62; }
    .r-hit { color: #2c7a2c; }
    .r-miss { color: #c44; }
    .r-score { font-family: var(--sans); font-size: 12px; color: #888; }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .topbar { padding: var(--sp-3) var(--sp-4); }
      .library { padding: var(--sp-6) var(--sp-4); gap: var(--sp-4); }
      .topbar h1 { font-size: 1.25rem; }
      .reader { padding: var(--sp-6) var(--sp-4); font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script>
    // ============ Storage ============
    const LF_META  = localforage.createInstance({ name: 'lector', storeName: 'meta' });
    const LF_TEXT  = localforage.createInstance({ name: 'lector', storeName: 'text' });
    const LF_AUDIO = localforage.createInstance({ name: 'lector', storeName: 'audio' });

    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    const Storage = {
      books: {
        async list() {
          const ids = (await LF_META.getItem('books:index')) || [];
          const out = [];
          for (const id of ids) {
            const b = await LF_META.getItem(`book:${id}`);
            if (b) out.push(b);
          }
          return out;
        },
        async get(id) { return LF_META.getItem(`book:${id}`); },
        async put(book) {
          if (!book.id) book.id = uid();
          const ids = (await LF_META.getItem('books:index')) || [];
          if (!ids.includes(book.id)) { ids.push(book.id); await LF_META.setItem('books:index', ids); }
          await LF_META.setItem(`book:${book.id}`, book);
          return book;
        },
        async delete(id) {
          const ids = ((await LF_META.getItem('books:index')) || []).filter(x => x !== id);
          await LF_META.setItem('books:index', ids);
          await LF_META.removeItem(`book:${id}`);
          // cascade chapters
          const chIdx = (await LF_META.getItem(`chapters:${id}`)) || [];
          for (const cid of chIdx) await Storage.chapters.delete(cid);
          await LF_META.removeItem(`chapters:${id}`);
        }
      },
      chapters: {
        async list(bookId) {
          const idx = (await LF_META.getItem(`chapters:${bookId}`)) || [];
          const out = [];
          for (const cid of idx) {
            const c = await LF_META.getItem(`chapter:${cid}`);
            if (c) out.push(c);
          }
          return out.sort((a,b) => a.index - b.index);
        },
        async get(id) {
          const meta = await LF_META.getItem(`chapter:${id}`);
          if (!meta) return null;
          const sourceText = await LF_TEXT.getItem(`chapter:${id}:source`);
          const versions = {};
          for (const lang of ['ru','en']) {
            const t = await LF_TEXT.getItem(`chapter:${id}:${lang}`);
            if (t) versions[lang] = t;
          }
          const esByLevel = {};
          for (const lvl of ['A2','B1','B2','C1']) {
            const t = await LF_TEXT.getItem(`chapter:${id}:es:${lvl}`);
            if (t) esByLevel[lvl] = t;
          }
          if (Object.keys(esByLevel).length) versions.es = esByLevel;
          return { ...meta, sourceText, versions };
        },
        async put(chapter) {
          if (!chapter.id) chapter.id = uid();
          // split text bodies out of meta
          const { sourceText, versions, ...meta } = chapter;
          const idx = (await LF_META.getItem(`chapters:${chapter.bookId}`)) || [];
          if (!idx.includes(chapter.id)) { idx.push(chapter.id); await LF_META.setItem(`chapters:${chapter.bookId}`, idx); }
          await LF_META.setItem(`chapter:${chapter.id}`, meta);
          if (sourceText != null) await LF_TEXT.setItem(`chapter:${chapter.id}:source`, sourceText);
          if (versions) {
            if (versions.ru) await LF_TEXT.setItem(`chapter:${chapter.id}:ru`, versions.ru);
            if (versions.en) await LF_TEXT.setItem(`chapter:${chapter.id}:en`, versions.en);
            if (versions.es) {
              for (const [lvl, txt] of Object.entries(versions.es)) {
                await LF_TEXT.setItem(`chapter:${chapter.id}:es:${lvl}`, txt);
              }
            }
          }
          return chapter;
        },
        async delete(id) {
          const c = await LF_META.getItem(`chapter:${id}`);
          if (!c) return;
          const idx = ((await LF_META.getItem(`chapters:${c.bookId}`)) || []).filter(x => x !== id);
          await LF_META.setItem(`chapters:${c.bookId}`, idx);
          await LF_META.removeItem(`chapter:${id}`);
          for (const suffix of ['source','ru','en','es:A2','es:B1','es:B2','es:C1']) {
            await LF_TEXT.removeItem(`chapter:${id}:${suffix}`);
          }
          // audio blobs cleaned lazily
        }
      },
      vocab: {
        async list(filter = {}) {
          const ids = (await LF_META.getItem('vocab:index')) || [];
          const out = [];
          for (const id of ids) {
            const v = await LF_META.getItem(`vocab:${id}`);
            if (!v) continue;
            if (filter.bookId && v.bookId !== filter.bookId) continue;
            out.push(v);
          }
          return out.sort((a,b) => b.createdAt - a.createdAt);
        },
        async put(entry) {
          if (!entry.id) entry.id = uid();
          if (!entry.createdAt) entry.createdAt = Date.now();
          const ids = (await LF_META.getItem('vocab:index')) || [];
          if (!ids.includes(entry.id)) { ids.push(entry.id); await LF_META.setItem('vocab:index', ids); }
          await LF_META.setItem(`vocab:${entry.id}`, entry);
          return entry;
        },
        async delete(word, bookId) {
          const list = await Storage.vocab.list({ bookId });
          for (const v of list) {
            if (v.word === word) {
              const ids = ((await LF_META.getItem('vocab:index')) || []).filter(x => x !== v.id);
              await LF_META.setItem('vocab:index', ids);
              await LF_META.removeItem(`vocab:${v.id}`);
            }
          }
        }
      },
      audio: {
        _key(chapterId, sentenceHash, voiceId) { return `${chapterId}:${sentenceHash}:${voiceId}`; },
        async put(chapterId, sentenceHash, voiceId, { blob, timings }) {
          const key = this._key(chapterId, sentenceHash, voiceId);
          await LF_AUDIO.setItem(key, { blob, timings, size: blob.size, ts: Date.now() });
          // update LRU index
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          const filtered = idx.filter(x => x.key !== key);
          filtered.push({ key, ts: Date.now(), size: blob.size });
          await LF_AUDIO.setItem('__lru__', filtered);
        },
        async get(chapterId, sentenceHash, voiceId) {
          const rec = await LF_AUDIO.getItem(this._key(chapterId, sentenceHash, voiceId));
          if (!rec) return null;
          // bump LRU
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).filter(x => x.key !== this._key(chapterId, sentenceHash, voiceId));
          idx.push({ key: this._key(chapterId, sentenceHash, voiceId), ts: Date.now(), size: rec.size });
          await LF_AUDIO.setItem('__lru__', idx);
          return { blob: rec.blob, timings: rec.timings };
        },
        async evictOldest(bytesToFree) {
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).sort((a,b) => a.ts - b.ts);
          let freed = 0;
          const remaining = [];
          for (const entry of idx) {
            if (freed < bytesToFree) {
              await LF_AUDIO.removeItem(entry.key);
              freed += entry.size;
            } else {
              remaining.push(entry);
            }
          }
          await LF_AUDIO.setItem('__lru__', remaining);
          return freed;
        },
        async stats() {
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          return { count: idx.length, bytes: idx.reduce((a,x) => a + x.size, 0) };
        }
      },
      settings: {
        async get(key, def = null) { return (await LF_META.getItem(`setting:${key}`)) ?? def; },
        async set(key, val) { return LF_META.setItem(`setting:${key}`, val); }
      }
    };

    // ============ Router (dead simple) ============
    const routes = {};
    let _currentRouteAbort = null;
    function route(name, renderFn) { routes[name] = renderFn; }
    function nav(name, params = {}) {
      if (_currentRouteAbort) { _currentRouteAbort.abort(); _currentRouteAbort = null; }
      window.scrollTo(0,0);
      const el = document.getElementById('app');
      el.innerHTML = '';
      routes[name](el, params);
    }

    // ============ Library screen ============
    route('library', async (el) => {
      const books = await Storage.books.list();
      el.innerHTML = `
        <header class="topbar"><h1>lector</h1>
          <div class="actions">
            <button id="btn-import">+ Import book</button>
            <button id="btn-vocab">Vocab</button>
            <button id="btn-settings">&#9881;</button>
          </div>
        </header>
        <main class="library">
          ${books.length === 0
            ? `<div class="empty"><p>No books yet.</p><button id="btn-import-2">Import your first book</button></div>`
            : books.map(b => `
              <article class="book-card" data-id="${b.id}">
                <h2>${escapeHtml(b.title)}</h2>
                <p class="author">${escapeHtml(b.author || '')}</p>
                <p class="meta">${escapeHtml(b.chapterCount ?? 0)} chapters</p>
                <button class="continue" data-id="${b.id}">&#9654; Continue</button>
              </article>`).join('')}
        </main>`;
      document.getElementById('btn-import')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-import-2')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-vocab')?.addEventListener('click', () => nav('vocab'));
      document.getElementById('btn-settings')?.addEventListener('click', () => nav('settings'));
      el.querySelectorAll('.book-card').forEach(c => c.addEventListener('click', () => nav('book', { id: c.dataset.id })));
    });

    // ============ splitIntoChapters ============
    function splitIntoChapters(text) {
      const lines = text.split(/\r?\n/);
      // Try heuristics in order; first that yields >=2 chapters wins.
      const heuristics = [
        { name: 'md-h2', re: /^##\s+(.+)$/ },
        { name: 'md-h3', re: /^###\s+(.+)$/ },
        { name: 'chapter-word', re: /^\s*(Глава|ГЛАВА|Часть|ЧАСТЬ|Chapter|CHAPTER|Capítulo|CAPÍTULO)\s+([IVXLCDM\d]+)(?:\s*[.:—-]?\s*(.*))?$/ }
      ];

      for (const h of heuristics) {
        const cuts = [];
        lines.forEach((line, i) => { const m = h.re.exec(line); if (m) cuts.push({ i, title: m[0].replace(/^#+\s*/, '').trim() }); });
        if (cuts.length >= 2) {
          const chapters = [];
          for (let k = 0; k < cuts.length; k++) {
            const start = cuts[k].i;
            const end = cuts[k+1] ? cuts[k+1].i : lines.length;
            const body = lines.slice(start + 1, end).join('\n').trim();
            chapters.push({ title: cuts[k].title, sourceText: body });
          }
          // Prepend front-matter as its own chapter if content exists before first cut
          const prelude = lines.slice(0, cuts[0].i).join('\n').trim();
          if (prelude.length > 500) chapters.unshift({ title: '(Front matter)', sourceText: prelude, frontMatter: true });
          return chapters;
        }
      }
      // Fallback: no chapters detected, whole thing is one chapter
      return [{ title: 'Chapter 1', sourceText: text.trim() }];
    }
    window.splitIntoChapters = splitIntoChapters;

    // ============ Sentence / paragraph splitters ============
    function splitSentences(text) {
      // Prefer Intl.Segmenter if available
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter('es', { granularity: 'sentence' });
          return [...seg.segment(text)].map(s => s.segment.trim()).filter(Boolean);
        } catch {}
      }
      // Regex fallback: sentence-terminal punctuation followed by whitespace
      return text.split(/(?<=[.!?…])\s+(?=[A-ZА-ЯÁÉÍÓÚÑ¿¡])/).map(s => s.trim()).filter(Boolean);
    }

    function splitParagraphs(text) {
      return text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    }

    // ============ TTS helpers ============
    async function sentenceHash(s) {
      const buf = new TextEncoder().encode(s);
      const digest = await crypto.subtle.digest('SHA-1', buf);
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 16);
    }

    function base64ToBlob(b64, type = 'audio/mpeg') {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    async function voiceChapter(chapter, book, voice, onProgress) {
      const bodyText = (chapter.versions?.es?.B1) || chapter.versions?.[book.sourceLang] || chapter.sourceText;
      if (!bodyText) throw new Error('no text to voice');
      const sentences = splitParagraphs(bodyText).flatMap(splitSentences);
      const voiceId = voice; // label 'narrator' or 'kravtsov'; hash-cached under label
      let prevReqIds = [];
      for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        const hash = await sentenceHash(s + '|' + voiceId);
        const existing = await Storage.audio.get(chapter.id, hash, voiceId);
        if (existing) {
          onProgress?.(i + 1, sentences.length);
          continue;
        }
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            text: s, model: 'multilingual_v2', voice, withTimestamps: true,
            previousRequestIds: prevReqIds.slice(-3)
          })
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'tts failed at sentence ' + i);
        const blob = base64ToBlob(j.audioBase64);
        await Storage.audio.put(chapter.id, hash, voiceId, { blob, timings: j.timings });
        if (j.requestId) prevReqIds.push(j.requestId);
        onProgress?.(i + 1, sentences.length);
      }
      onProgress?.(sentences.length, sentences.length);
      const updated = await Storage.chapters.get(chapter.id);
      updated.voiced = { ...(updated.voiced || {}), [voiceId]: true };
      await Storage.chapters.put(updated);
    }

    // ============ Recognition helpers ============
    function normalizeWords(s) {
      return s.toLowerCase().replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').split(/\s+/).filter(Boolean);
    }

    async function reciteSentence(sentEl, expected, lang) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('SpeechRecognition not supported in this browser'); return; }
      const rec = new SR();
      rec.lang = lang === 'es' ? 'es-ES' : lang === 'ru' ? 'ru-RU' : 'en-GB';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      sentEl.classList.add('reciting');
      rec.start();
      rec.onresult = (ev) => {
        const heard = ev.results[0][0].transcript;
        const want = normalizeWords(expected);
        const got = normalizeWords(heard);
        const matched = new Set();
        got.forEach(g => { const i = want.indexOf(g); if (i >= 0 && !matched.has(i)) matched.add(i); });
        const score = Math.round(100 * matched.size / want.length);
        // annotate sentence: rebuild spans with color classes
        const spans = [...sentEl.querySelectorAll('.w')];
        let wi = 0;
        spans.forEach(sp => {
          const w = sp.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g,'').toLowerCase().trim();
          if (!w) return;
          sp.classList.remove('r-hit','r-miss');
          sp.classList.add(matched.has(wi) ? 'r-hit' : 'r-miss');
          wi++;
        });
        sentEl.classList.remove('reciting');
        const badge = document.createElement('span'); badge.className = 'r-score'; badge.textContent = ' ' + score + '%';
        sentEl.appendChild(badge);
        setTimeout(() => {
          spans.forEach(sp => sp.classList.remove('r-hit','r-miss'));
          badge.remove();
        }, 5000);
      };
      rec.onerror = () => sentEl.classList.remove('reciting');
      rec.onend = () => sentEl.classList.remove('reciting');
    }

    // ============ RWL Playback Engine ============
    const Player = {
      audioEl: null, chapter: null, book: null, sentences: [], voiceId: null, idx: 0, timings: [], speed: 1, saveTimer: null,
      async start(chapter, book, fromIdx = 0) {
        this.stop();
        const voiceId = book.narratorVoice || 'narrator';
        // Self-guard: refuse to start if chapter has no voiced audio for this voice
        if (!chapter.voiced?.[voiceId]) {
          console.warn('[Player] chapter not voiced for', voiceId);
          return;
        }
        this.chapter = chapter; this.book = book; this.voiceId = voiceId;
        const body = chapter.versions?.es?.B1 || chapter.versions?.[book.sourceLang] || chapter.sourceText;
        this.sentences = splitParagraphs(body).flatMap(splitSentences);
        this.idx = fromIdx;
        this.audioEl = new Audio();
        this.audioEl.playbackRate = this.speed;
        this.audioEl.addEventListener('ended', () => this._next());
        this.audioEl.addEventListener('timeupdate', () => this._highlightWord());
        this._play().catch(err => { console.error('[Player]', err); this.stop(); });
        this.saveTimer = setInterval(() => this._savePos(), 5000);
      },
      async _play() {
        if (this.idx >= this.sentences.length) return this.stop();
        const s = this.sentences[this.idx];
        const hash = await sentenceHash(s + '|' + this.voiceId);
        const rec = await Storage.audio.get(this.chapter.id, hash, this.voiceId);
        if (!rec) { console.warn('[Player] missing audio for sentence', this.idx); return this._next(); }
        this.timings = rec.timings || [];
        if (this.audioEl.src) URL.revokeObjectURL(this.audioEl.src);
        this.audioEl.src = URL.createObjectURL(rec.blob);
        document.querySelectorAll('.sent.playing').forEach(x => x.classList.remove('playing'));
        const sentEl = document.querySelector(`.sent[data-sent="${this.idx}"]`);
        if (sentEl) { sentEl.classList.add('playing'); sentEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        await this.audioEl.play();
      },
      _next() { this.idx++; this._savePos(); this._play().catch(err => { console.error('[Player]', err); this.stop(); }); },
      _highlightWord() {
        const t = this.audioEl.currentTime;
        const w = this.timings.find(x => t >= x.startSec && t <= x.endSec);
        document.querySelectorAll('.wnow').forEach(x => x.classList.remove('wnow'));
        if (!w) return;
        const sentEl = document.querySelector('.sent.playing');
        if (!sentEl) return;
        const spans = [...sentEl.querySelectorAll('.w')];
        const hit = spans.find(sp => sp.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').trim().toLowerCase() === w.word.toLowerCase());
        if (hit) hit.classList.add('wnow');
      },
      setSpeed(s) { this.speed = s; if (this.audioEl) this.audioEl.playbackRate = s; },
      async _savePos() {
        if (!this.chapter) return;
        const ch = await Storage.chapters.get(this.chapter.id);
        if (!ch) return;
        ch.playbackResume = { sentenceIndex: this.idx, audioTimeSec: this.audioEl?.currentTime || 0, voiceId: this.voiceId };
        ch.positionFraction = this.sentences.length ? this.idx / this.sentences.length : 0;
        await Storage.chapters.put({ ...ch, sourceText: ch.sourceText });
      },
      pause() { this.audioEl?.pause(); this._savePos(); },
      resume() { this.audioEl?.play(); },
      stop() {
        if (this.saveTimer) { clearInterval(this.saveTimer); this.saveTimer = null; }
        if (this.audioEl) { this.audioEl.pause(); if (this.audioEl.src) { URL.revokeObjectURL(this.audioEl.src); } this.audioEl = null; }
        document.querySelectorAll('.sent.playing, .wnow').forEach(x => x.classList.remove('playing', 'wnow'));
        this.chapter = null; this.book = null; this.sentences = []; this.timings = []; this.idx = 0;
      }
    };

    // ============ Spanish generator ============
    async function generateSpanish(chapter, book, level, onProgress) {
      const source = chapter.sourceText || chapter.versions?.[book.sourceLang];
      if (!source) throw new Error('no source text');
      const paras = splitParagraphs(source);
      const out = [];
      for (let i = 0; i < paras.length; i++) {
        onProgress?.(i, paras.length);
        const r = await fetch('/api/llm', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            task: 'translate_chunk',
            input: {
              text: paras[i],
              targetLang: 'es',
              level,
              prevContext: paras[i-1] || undefined,
              nextContext: paras[i+1] || undefined
            },
            glossary: book.glossary || [],
            bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
          })
        });
        if (!r.ok) {
          let msg;
          try { const j = await r.json(); msg = j.error || `HTTP ${r.status}`; }
          catch { msg = `HTTP ${r.status} (non-JSON body)`; }
          throw new Error(`translate failed at para ${i}: ${msg}`);
        }
        let j;
        try { j = await r.json(); }
        catch { throw new Error(`translate failed at para ${i}: response not JSON`); }
        if (!j.result || typeof j.result.text !== 'string') {
          throw new Error(`translate failed at para ${i}: unexpected response shape`);
        }
        out.push(j.result.text);
      }
      onProgress?.(paras.length, paras.length);
      // Persist
      const updated = await Storage.chapters.get(chapter.id);
      updated.versions = updated.versions || {};
      updated.versions.es = { ...(updated.versions.es || {}), [level]: out.join('\n\n') };
      await Storage.chapters.put({ ...updated, sourceText: source });
      return updated.versions.es[level];
    }

          const sent = w.closest('.sent');
          const word = w.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').trim();
          if (!word) return;
          const sentence = sent.textContent.trim();
          pop.hidden = false;
          pop.innerHTML = `<div class="pop-loading">Looking up &#8220;${escapeHtml(word)}&#8221;&#8230;</div>`;
          const rect = w.getBoundingClientRect();
          pop.style.left = Math.max(8, Math.min(window.innerWidth - 320, rect.left)) + 'px';
          pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';

          try {
            const r = await fetch('/api/llm', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                task: 'gloss',
                input: { tappedWord: word, sentence, displayLang },
                glossary: book.glossary || [],
                bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
              })
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
            const g = j.result;
            pop.innerHTML = `
              <div class="pop-word"><b>${escapeHtml(g.word)}</b> <span class="pop-lemma">(${escapeHtml(g.lemma)})</span></div>
              <div class="pop-gloss">${escapeHtml(g.gloss)}</div>
              <div class="pop-note">${escapeHtml(g.note || '')}</div>
              <div class="pop-actions">
                <button id="pop-save">+ save</button>
                <button id="pop-speak">🔊</button>
                <button id="pop-close">✕</button>
              </div>`;
            document.getElementById('pop-save').addEventListener('click', async () => {
              await Storage.vocab.put({
                word: g.word, lemma: g.lemma, gloss: g.gloss, sourceSentence: sentence,
                bookId: book.id, chapterId: ch.id, displayLangAtSave: displayLang, exported: false
              });
              if (!pop.hidden) {
                const btn = document.getElementById('pop-save');
                if (btn) btn.textContent = '✓ saved';
              }
            });
            document.getElementById('pop-speak').addEventListener('click', async () => {
              const r = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ text: sentence, model: 'flash_v2_5', voice: book.narratorVoice || 'narrator', withTimestamps: false })
              });
              if (!r.ok) return alert('TTS error');
              const blob = await r.blob();
              new Audio(URL.createObjectURL(blob)).play();
            });
            document.getElementById('pop-close').addEventListener('click', () => { pop.hidden = true; });
          } catch (err) {
            pop.innerHTML = `<div class="pop-error">${escapeHtml(err.message)}</div>`;
          }
        });

        // Dismiss on scroll or outside click
        document.addEventListener('scroll', () => { pop.hidden = true; }, { passive: true, signal: readerAbort.signal });
        document.addEventListener('mousedown', (e) => {
          if (!pop.contains(e.target) && !e.target.closest('.w')) pop.hidden = true;
        }, { signal: readerAbort.signal });
      }

      // ---- Frank-style sentence breakdown on double-click ----
      el.querySelector('main.reader').addEventListener('dblclick', async (e) => {
        const sent = e.target.closest('.sent');
        if (!sent || sent.dataset.hasBreakdown) return;
        const sentence = sent.textContent.trim();
        const l1 = displayLang === 'es' ? (book.sourceLang === 'ru' ? 'ru' : 'en') : displayLang;
        const holder = document.createElement('div');
        holder.className = 'breakdown';
        holder.textContent = 'Loading breakdown...';
        sent.after(holder);
        sent.dataset.hasBreakdown = '1';

        try {
          const r = await fetch('/api/llm', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              task: 'breakdown',
              input: { sentence, displayLang, l1 },
              glossary: book.glossary || [],
              bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
            })
          });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error);
          const b = j.result;
          holder.innerHTML = `
            <div class="bd-chunks">${b.chunks.map(c => `<span class="bd-ch"><span class="bd-t">${escapeHtml(c.text)}</span> <span class="bd-g">(${escapeHtml(c.gloss)})</span></span>`).join(' ')}</div>
            <div class="bd-clean">${escapeHtml(b.clean)}</div>
            <button class="bd-close">&#10005;</button>`;
          holder.querySelector('.bd-close').addEventListener('click', () => { holder.remove(); delete sent.dataset.hasBreakdown; });
        } catch (err) {
          holder.textContent = 'Error: ' + err.message;
        }
      });
    });

    // stubs so nav() doesn't throw before those screens exist
    route('vocab', async (el) => {
      const books = await Storage.books.list();
      const all = await Storage.vocab.list();
      const filterId = await Storage.settings.get('vocabFilter', '');
      const shown = filterId ? all.filter(v => v.bookId === filterId) : all;
      const emptyRow = shown.length === 0
        ? '<tr><td colspan="6"><em>No vocab saved yet.</em></td></tr>'
        : shown.map(v => {
            const bookTitle = books.find(b => b.id === v.bookId)?.title || '';
            return `<tr data-id="${escapeHtml(v.id)}">
              <td><b>${escapeHtml(v.word)}</b></td>
              <td>${escapeHtml(v.lemma || '')}</td>
              <td>${escapeHtml(v.gloss)}</td>
              <td class="src">${escapeHtml(v.sourceSentence)}</td>
              <td>${escapeHtml(bookTitle)}</td>
              <td><button class="del">&#10005;</button></td>
            </tr>`;
          }).join('');
      el.innerHTML = `
        <header class="topbar"><button onclick="nav('library')">&#8592;</button><h1>Vocab (${shown.length})</h1>
          <select id="vf">
            <option value="">All books</option>
            ${books.map(b => `<option value="${escapeHtml(b.id)}" ${b.id===filterId?'selected':''}>${escapeHtml(b.title)}</option>`).join('')}
          </select>
          <button id="vx">Export TSV &rarr; clipboard</button>
        </header>
        <main class="vocab-list">
          <table>
            <thead><tr><th>Word</th><th>Lemma</th><th>Gloss</th><th>Source sentence</th><th>Book</th><th></th></tr></thead>
            <tbody>${emptyRow}</tbody>
          </table>
        </main>`;
      document.getElementById('vf').addEventListener('change', async (e) => {
        await Storage.settings.set('vocabFilter', e.target.value);
        nav('vocab');
      });
      document.getElementById('vx').addEventListener('click', async () => {
        const tsv = shown.map(v => {
          const book = books.find(b => b.id === v.bookId);
          const ch = v.chapterId;
          return [v.word, v.gloss, v.sourceSentence.replace(/\t/g, ' '), book?.title || '', ch || ''].join('\t');
        }).join('\n');
        try {
          await navigator.clipboard.writeText(tsv);
          document.getElementById('vx').textContent = '✓ copied ' + shown.length + ' rows';
        } catch (err) {
          document.getElementById('vx').textContent = 'Clipboard denied — select & copy manually';
        }
        setTimeout(() => nav('vocab'), 1500);
      });
      el.querySelectorAll('tr[data-id] .del').forEach(btn => btn.addEventListener('click', async (e) => {
        const row = e.target.closest('tr');
        const id = row.dataset.id;
        const v = all.find(x => x.id === id);
        if (v) { await Storage.vocab.delete(v.word, v.bookId); nav('vocab'); }
      }));
    });
    route('settings', async (el) => {
      const health = await fetch('/api/health').then(r => r.json()).catch(() => ({}));
      const stats = await Storage.audio.stats();
      const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
      const books = await Storage.books.list();
      el.innerHTML = `
        <header class="topbar"><button onclick="nav('library')">&#8592;</button><h1>Settings</h1></header>
        <main class="settings">
          <section>
            <h3>Backend</h3>
            <ul>
              <li>LLM: ${health.llmConfigured ? '&#10003;' : '&#10007;'}</li>
              <li>TTS: ${health.ttsConfigured ? '&#10003;' : '&#10007;'}</li>
              <li>Narrator voice: ${health.voices?.narrator ? '&#10003;' : '&#10007; not set'}</li>
              <li>Kravtsov voice: ${health.voices?.kravtsov ? '&#10003;' : '&#10007; not set'}</li>
            </ul>
          </section>
          <section>
            <h3>Cache</h3>
            <p>Audio: ${stats.count} clips, ${(stats.bytes/1024/1024).toFixed(1)} MB</p>
            ${est ? `<p>Browser storage: ${(est.usage/1024/1024).toFixed(0)} / ${(est.quota/1024/1024).toFixed(0)} MB</p>` : ''}
            <button id="btn-evict">Evict half the cache</button>
            <button id="btn-wipe" class="danger">Wipe everything</button>
          </section>
          <section>
            <h3>Per-book narrator voice</h3>
            <ul>
              ${books.map(b => `<li>${escapeHtml(b.title)}
                <select data-book="${escapeHtml(b.id)}" class="voice-sel">
                  <option value="narrator" ${b.narratorVoice==='narrator'?'selected':''}>Narrator (Spanish)</option>
                  <option value="kravtsov" ${b.narratorVoice==='kravtsov'?'selected':''}>Kravtsov (cloned)</option>
                </select></li>`).join('')}
            </ul>
          </section>
        </main>`;
      document.getElementById('btn-evict').addEventListener('click', async () => {
        const freed = await Storage.audio.evictOldest(stats.bytes / 2);
        alert('Freed ' + (freed/1024/1024).toFixed(1) + ' MB');
        nav('settings');
      });
      document.getElementById('btn-wipe').addEventListener('click', async () => {
        if (!confirm('Wipe ALL books, chapters, vocab, and audio? This cannot be undone.')) return;
        await Promise.all([LF_META.clear(), LF_TEXT.clear(), LF_AUDIO.clear()]);
        nav('library');
      });
      el.querySelectorAll('.voice-sel').forEach(sel => sel.addEventListener('change', async (e) => {
        const b = await Storage.books.get(e.target.dataset.book);
        b.narratorVoice = e.target.value;
        await Storage.books.put(b);
      }));
    });

    window.Storage = Storage;
    window.nav = nav;
    window.escapeHtml = escapeHtml;
    nav('library');
  </script>
</body>
</html>
