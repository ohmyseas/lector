<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --serif: 'Literata', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;

      /* Colors — light theme (default) */
      --fg:      #1a1a1a;
      --fg-muted:#555;
      --bg:      #fafaf8;
      --bg-card: #fff;
      --accent:  #2d6a4f;
      --accent-h:#1b4332;
      --border:  #e4e4e0;
      --highlight-bg: #fff7d0;
      --breakdown-bg: #f7f4ee;

      /* Spacing scale */
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;
      --sp-12: 3rem;

      /* Layout */
      --max-w: 52rem;
      --radius: 10px;

      /* Reader typography (user-adjustable) */
      --reader-font-size: 1.05rem;
      --reader-line-height: 1.75;
    }

    /* Dark theme */
    :root[data-theme="dark"] {
      --fg:      #e8e6e0;
      --fg-muted:#a0a0a0;
      --bg:      #14161a;
      --bg-card: #1e2126;
      --accent:  #5ba077;
      --accent-h:#79b990;
      --border:  #2f3238;
      --highlight-bg: #3a3620;
      --breakdown-bg: #1f1d16;
    }
    /* Auto: honour system preference */
    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] {
        --fg:      #e8e6e0;
        --fg-muted:#a0a0a0;
        --bg:      #14161a;
        --bg-card: #1e2126;
        --accent:  #5ba077;
        --accent-h:#79b990;
        --border:  #2f3238;
        --highlight-bg: #3a3620;
        --breakdown-bg: #1f1d16;
      }
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-6);
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .topbar .actions {
      display: flex;
      gap: var(--sp-2);
      align-items: center;
    }

    /* ===== Buttons ===== */
    button {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: var(--sp-2) var(--sp-4);
      transition: background 0.15s, color 0.15s;
    }
    button.primary, #btn-import, #btn-import-2 {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover, #btn-import:hover, #btn-import-2:hover {
      background: var(--accent-h);
    }
    button.ghost {
      background: transparent;
      color: var(--fg-muted);
    }
    button.ghost:hover {
      background: var(--border);
      color: var(--fg);
    }
    #btn-vocab, #btn-settings {
      background: transparent;
      color: var(--fg-muted);
      padding: var(--sp-2) var(--sp-3);
    }
    #btn-vocab:hover, #btn-settings:hover {
      background: var(--border);
      color: var(--fg);
    }

    /* ===== Library grid ===== */
    .library {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
      gap: var(--sp-6);
    }

    /* ===== Book card ===== */
    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .book-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .book-card h2 {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .book-card .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
    }
    .book-card .meta {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: auto;
    }
    .book-card .continue {
      margin-top: var(--sp-4);
      background: var(--accent);
      color: #fff;
      align-self: flex-start;
      padding: var(--sp-2) var(--sp-4);
    }
    .book-card .continue:hover { background: var(--accent-h); }

    /* ===== Empty state ===== */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--sp-12) var(--sp-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-6);
    }
    .empty p {
      font-size: 1.125rem;
      color: var(--fg-muted);
    }
    .empty button {
      font-size: 1rem;
      padding: var(--sp-3) var(--sp-8);
    }

    /* ===== Stub screens ===== */
    .stub {
      max-width: var(--max-w);
      margin: var(--sp-8) auto;
      padding: 0 var(--sp-6);
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .stub button { margin-top: var(--sp-4); }

    /* ===== Book detail ===== */
    .book-detail {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-6);
    }
    .book-detail .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
      margin-top: var(--sp-1);
    }
    .chapters {
      list-style: none;
      margin-top: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .chapters li {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .chapters li:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .ch-idx {
      font-size: 0.75rem;
      color: var(--fg-muted);
      min-width: 1.5rem;
      text-align: right;
    }
    .ch-title {
      flex: 1;
      font-family: var(--serif);
      font-size: 0.95rem;
    }
    .chips {
      display: flex;
      gap: var(--sp-1);
      flex-shrink: 0;
    }
    .chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
    }

    /* ===== Reader ===== */
    .reader-topbar {
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .crumbs {
      flex: 1;
      font-size: 0.875rem;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pills {
      display: flex;
      gap: 4px;
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .pill.active {
      background: var(--accent);
      color: #fff;
    }
    .pill:hover:not(.active) {
      background: #d5e8de;
      color: var(--accent);
    }
    /* .play-btn styles moved to RWL Playback section below */
    .reader {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      font-family: var(--serif);
      font-size: 1.125rem;
      line-height: 1.8;
    }
    .reader p {
      margin-bottom: var(--sp-6);
    }
    .sent {
      border-radius: 3px;
    }
    .sent:hover {
      background: rgba(45,106,79,0.08);
    }
    .reader .empty {
      grid-column: unset;
      text-align: left;
    }
    .reader .empty p {
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .reader .empty button {
      margin-top: var(--sp-4);
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== Word popover ===== */
    #popover { position: fixed; z-index: 100; background: var(--bg); border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 320px; font-family: var(--sans); font-size: 14px; max-height: 80vh; overflow-y: auto; }
    .pop-word { font-size: 16px; margin-bottom: 4px; }
    .pop-lemma { color: #888; font-size: 13px; font-style: italic; }
    .pop-gloss { margin: 8px 0; }
    .pop-note { color: #555; font-size: 13px; }
    .pop-actions { margin-top: 10px; display: flex; gap: 8px; }
    .w { cursor: pointer; }
    .w:hover { background: #fffbe0; }

    /* ===== Breakdown (Frank-style) ===== */
    .breakdown { background: var(--breakdown-bg); border-left: 3px solid #b89b62; padding: 10px 14px; margin: 6px 0 12px; font-family: var(--sans); font-size: 14px; position: relative; }
    .bd-ch { display: inline-block; margin-right: 6px; }
    .bd-g { color: #7a6b48; font-style: italic; font-size: 12px; }
    .bd-clean { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d7c99a; }
    .bd-close { position: absolute; top: 6px; right: 8px; background: transparent; border: 0; cursor: pointer; font-size: 14px; color: var(--fg-muted); }

    /* ===== Reader body with user-adjustable typography ===== */
    main.reader { font-size: var(--reader-font-size); line-height: var(--reader-line-height); }
    main.reader p { margin: 0 0 var(--sp-6); position: relative; }
    main.reader.show-sent-nums .sent::before {
      content: attr(data-sent);
      position: absolute; left: -2.5rem;
      font-family: var(--sans); font-size: 0.7rem; color: var(--fg-muted);
      opacity: 0.5; padding-top: 3px;
    }
    /* Progress bar under topbar (block-level, always visible) */
    .reader-progress {
      height: 3px; background: var(--border);
      position: sticky; top: 3.5rem; z-index: 8;
    }
    .reader-progress-fill {
      height: 100%; background: var(--accent);
      width: 0%; transition: width 0.3s;
    }
    /* Loop mode indicator */
    .loop-btn.loop-sent { color: var(--accent); border-color: var(--accent); background: var(--accent); color: white; }
    .loop-btn.loop-para { color: var(--accent); border-color: var(--accent); background: var(--accent-h); color: white; }
    /* Bookmark marker on sentences */
    .sent.bookmarked::after {
      content: '\1F516';
      position: absolute; margin-left: 4px;
      font-size: 0.8em; opacity: 0.7;
    }
    /* Modal (for confirm-cost dialog etc.) */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: var(--sp-4); }
    .modal { background: var(--bg-card); color: var(--fg); border-radius: var(--radius); padding: var(--sp-6); max-width: 480px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .modal h3 { margin-bottom: var(--sp-3); }
    .modal .modal-body { margin: var(--sp-3) 0; font-size: 0.95rem; line-height: 1.5; color: var(--fg-muted); }
    .modal .modal-body b { color: var(--fg); }
    .modal .modal-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-4); }
    .modal .modal-actions button { padding: var(--sp-2) var(--sp-4); font-size: 0.9rem; }
    .modal-actions .primary { background: var(--accent); color: white; border: 1px solid var(--accent); border-radius: 4px; }
    .modal-actions .secondary { background: var(--bg-card); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; }
    /* Search box */
    .search-row { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); align-items: center; }
    .search-input { flex: 1; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: 4px; font-family: var(--sans); font-size: 0.9rem; background: var(--bg-card); color: var(--fg); }
    .search-input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    .sort-select { padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: 4px; font-family: var(--sans); font-size: 0.9rem; background: var(--bg-card); color: var(--fg); }
    /* Chapter list actions (delete/rename) */
    .chapter-row { display: flex; align-items: center; gap: var(--sp-2); }
    .ch-actions { margin-left: auto; opacity: 0.4; display: flex; gap: 2px; }
    li.chapter-row:hover .ch-actions { opacity: 1; }
    .ch-actions button { background: transparent; border: 1px solid transparent; padding: 2px 6px; font-size: 12px; color: var(--fg-muted); cursor: pointer; border-radius: 3px; }
    .ch-actions button:hover { background: var(--border); color: var(--fg); }
    .ch-actions .ch-delete:hover { background: #fdd; color: #c33; }
    /* Glossary editor */
    .glossary-editor { margin: var(--sp-6) 0; padding: var(--sp-4); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
    .glossary-editor h3 { margin-bottom: var(--sp-3); font-size: 1rem; }
    .glossary-list { display: grid; grid-template-columns: 1fr 1fr auto; gap: var(--sp-2); margin-bottom: var(--sp-2); }
    .glossary-list input { padding: var(--sp-2); border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    .glossary-list .del-term { background: transparent; border: 1px solid var(--border); padding: 2px 8px; cursor: pointer; color: var(--fg-muted); border-radius: 3px; }
    .glossary-list .del-term:hover { background: #fdd; color: #c33; }
    /* Settings panel additions */
    .settings-section { padding: var(--sp-4); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: var(--sp-4); }
    .settings-section h3 { margin-bottom: var(--sp-3); font-size: 1rem; }
    .settings-row { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); font-size: 0.9rem; }
    .settings-row label { flex: 1; }
    .settings-row select, .settings-row input[type="range"], .settings-row input[type="url"] { padding: var(--sp-2); border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 0.85rem; }
    .settings-row input[type="range"] { flex: 2; }
    .settings-row input[type="url"] { min-width: 220px; }
    .settings-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3); }
    .settings-actions button { padding: var(--sp-2) var(--sp-3); font-size: 0.85rem; }
    /* Bookmark list in book detail */
    .bookmarks-list { padding: 0; list-style: none; }
    .bookmarks-list li { padding: var(--sp-2); border-bottom: 1px solid var(--border); font-size: 0.85rem; cursor: pointer; }
    .bookmarks-list li:hover { background: var(--border); }
    /* Vocab search + edit */
    .vocab-list td.editable[contenteditable="true"] { outline: 2px solid var(--accent); background: var(--bg-card); }

    /* ===== Voice button ===== */
    .voice-btn {
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      padding: var(--sp-2) var(--sp-3);
    }
    .voice-btn:hover:not(:disabled) { background: var(--accent-h); }
    .voice-btn:disabled { opacity: 0.6; cursor: default; }

    /* ===== RWL Playback ===== */
    .sent.playing { background: var(--highlight-bg); border-radius: 3px; }
    .wnow { border-bottom: 2px solid var(--accent); }
    .player-controls { display: flex; align-items: center; gap: 4px; }
    .pc-btn { font-size: 14px; padding: 4px 8px; background: transparent; color: var(--fg-muted); border: 1px solid transparent; border-radius: 4px; cursor: pointer; min-width: 32px; }
    .pc-btn:hover:not(:disabled) { background: var(--border); color: var(--fg); }
    .pc-btn[disabled] { opacity: 0.35; cursor: not-allowed; }
    .play-btn { font-size: 16px; padding: 4px 12px; }
    .speed { font-family: var(--sans); font-size: 0.8rem; padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--fg); cursor: pointer; margin-left: 4px; }
    .pop-play-row { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); flex-wrap: wrap; }
    .pop-play-row button { font-size: 12px; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    .pop-play-row button:hover:not(:disabled) { background: var(--border); }
    .pop-play-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pop-play-row #pop-jump-sent, .pop-play-row #pop-jump-para { background: var(--accent); color: white; border-color: var(--accent); }
    .pop-play-row #pop-jump-sent:hover:not(:disabled), .pop-play-row #pop-jump-para:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
    .pop-hint { margin: 6px 0 0; color: var(--fg-muted); }
    .book-card { position: relative; }
    .book-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0.4; transition: opacity 0.15s; }
    .book-card:hover .book-actions { opacity: 1; }
    .book-edit, .book-delete { background: transparent; border: 1px solid transparent; color: var(--fg-muted); font-size: 15px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .book-edit:hover { background: var(--border); color: var(--fg); border-color: var(--border); }
    .book-delete:hover { background: #fdd; color: #c33; border-color: #f88; }
    .book-delete:disabled, .book-edit:disabled { cursor: wait; }
    .icon-btn { background: transparent; border: 1px solid transparent; color: var(--fg-muted); font-size: 18px; padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-left: auto; }
    .icon-btn:hover { background: var(--border); color: var(--fg); }
    .book-heading { display: flex; flex-direction: column; }
    .book-heading.edit-mode { gap: 8px; width: 100%; }
    .edit-field { display: flex; flex-direction: column; font-family: var(--sans); font-size: 12px; color: var(--fg-muted); gap: 3px; }
    .edit-field input, .edit-field textarea { font-family: var(--serif); font-size: 15px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); resize: vertical; }
    .edit-actions { display: flex; gap: 6px; }
    button.secondary { font-size: 14px; padding: 6px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: var(--sans); color: var(--fg); }
    button.secondary:hover { background: var(--border); }
    .pill.has-content { border-color: var(--accent); color: var(--fg); }
    .pill .pill-dot { color: var(--accent); font-size: 14px; line-height: 1; margin-left: 2px; vertical-align: 0; }
    .lang-availability { font-family: var(--sans); font-size: 13px; color: var(--fg-muted); margin: 8px 0 16px; }
    .lang-chip-mini { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--bg-card); border: 1px solid var(--accent); font-size: 12px; margin-right: 4px; color: var(--fg); font-weight: 500; }
    .cta-generate { font-size: 15px; padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; margin: 8px 0; font-family: var(--sans); }
    .cta-generate:hover:not(:disabled) { filter: brightness(1.05); }
    .cta-generate:disabled { opacity: 0.5; cursor: wait; }
    .empty-title { font-size: 15px; margin-bottom: 8px; color: var(--fg); }

    /* ===== Recite mode ===== */
    .sent.reciting { outline: 2px dashed #b89b62; }
    .r-hit { color: #2c7a2c; }
    .r-miss { color: #c44; }
    .r-score { font-family: var(--sans); font-size: 12px; color: #888; }

    /* ===== Long-press sentence menu (mobile) ===== */
    .sent-menu {
      position: absolute;
      z-index: 200;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: grid;
      gap: 2px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      min-width: 180px;
    }
    .sent-menu button {
      text-align: left;
      padding: 9px 14px;
      background: var(--bg-card);
      border: 0;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 14px;
      cursor: pointer;
      color: var(--fg);
    }
    .sent-menu button:hover, .sent-menu button:active {
      background: var(--border);
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .topbar { padding: var(--sp-3) var(--sp-4); flex-wrap: wrap; }
      .topbar h1 { font-size: 1.2rem; }
      .library { padding: var(--sp-6) var(--sp-4); gap: var(--sp-4); grid-template-columns: 1fr; }
      .reader { padding: var(--sp-6) var(--sp-4); font-size: 1rem; }
      .crumbs { font-size: 0.8rem; }
      .reader-topbar { gap: var(--sp-1); }
    }
    @media (max-width: 480px) {
      .topbar { padding: var(--sp-3) var(--sp-4); }
      .library { padding: var(--sp-6) var(--sp-4); gap: var(--sp-4); }
      .topbar h1 { font-size: 1.25rem; }
      .reader { padding: var(--sp-6) var(--sp-4); font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script>
    // ============ Storage ============
    const LF_META  = localforage.createInstance({ name: 'lector', storeName: 'meta' });
    const LF_TEXT  = localforage.createInstance({ name: 'lector', storeName: 'text' });
    const LF_AUDIO = localforage.createInstance({ name: 'lector', storeName: 'audio' });

    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ============ Cross-tab sync via BroadcastChannel ============
    // Storage.chapters.put + Storage.books.put + Storage.vocab.put broadcast a change event.
    // Other tabs receive it and can re-render if they happen to display affected state.
    const CrossTab = (function() {
      const ch = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('lector-sync') : null;
      function post(kind, id) { try { ch?.postMessage({ kind, id, ts: Date.now() }); } catch {} }
      function listen(fn) { if (ch) ch.addEventListener('message', ev => fn(ev.data)); }
      return { post, listen };
    })();
    window.CrossTab = CrossTab;

    // ============ Preferences (theme + reader typography + sentence numbers) ============
    // Loaded EARLY so first render already reflects user's choice.
    async function applyPrefs() {
      try {
        const theme = await LF_META.getItem('setting:theme') || 'auto';
        const fontSize = await LF_META.getItem('setting:readerFontSize') || 1.05;
        const lineHeight = await LF_META.getItem('setting:readerLineHeight') || 1.75;
        const showNums = await LF_META.getItem('setting:showSentenceNumbers') || false;
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.setProperty('--reader-font-size', fontSize + 'rem');
        document.documentElement.style.setProperty('--reader-line-height', lineHeight);
        window.__prefsShowNums = showNums;
      } catch (err) { console.warn('applyPrefs failed', err); }
    }
    // Fire immediately
    applyPrefs();

    const Storage = {
      books: {
        async list() {
          const ids = (await LF_META.getItem('books:index')) || [];
          const out = [];
          for (const id of ids) {
            const b = await LF_META.getItem(`book:${id}`);
            if (b) out.push(b);
          }
          return out;
        },
        async get(id) { return LF_META.getItem(`book:${id}`); },
        async put(book) {
          if (!book.id) book.id = uid();
          if (!book.createdAt) book.createdAt = Date.now();
          const ids = (await LF_META.getItem('books:index')) || [];
          if (!ids.includes(book.id)) { ids.push(book.id); await LF_META.setItem('books:index', ids); }
          await LF_META.setItem(`book:${book.id}`, book);
          try { CrossTab.post('book:put', book.id); } catch {}
          return book;
        },
        async delete(id) {
          // Capture chapter IDs BEFORE removing so we can purge audio blobs
          const chIdx = (await LF_META.getItem(`chapters:${id}`)) || [];
          const ids = ((await LF_META.getItem('books:index')) || []).filter(x => x !== id);
          await LF_META.setItem('books:index', ids);
          await LF_META.removeItem(`book:${id}`);
          try { CrossTab.post('book:delete', id); } catch {}
          // Purge audio blobs owned by these chapters (audio store keys are `chapterId:hash:voiceKey`)
          try {
            const lru = (await LF_AUDIO.getItem('__lru__')) || [];
            const keep = [];
            for (const entry of lru) {
              const chId = entry.key.split(':')[0];
              if (chIdx.includes(chId)) {
                await LF_AUDIO.removeItem(entry.key);
              } else {
                keep.push(entry);
              }
            }
            await LF_AUDIO.setItem('__lru__', keep);
          } catch (err) { console.warn('[books.delete] audio purge partial:', err); }
          // cascade chapter meta + text
          for (const cid of chIdx) await Storage.chapters.delete(cid);
          await LF_META.removeItem(`chapters:${id}`);
        }
      },
      chapters: {
        async list(bookId) {
          const idx = (await LF_META.getItem(`chapters:${bookId}`)) || [];
          const out = [];
          for (const cid of idx) {
            const c = await LF_META.getItem(`chapter:${cid}`);
            if (c) out.push(c);
          }
          return out.sort((a,b) => a.index - b.index);
        },
        async get(id) {
          const meta = await LF_META.getItem(`chapter:${id}`);
          if (!meta) return null;
          const sourceText = await LF_TEXT.getItem(`chapter:${id}:source`);
          const versions = {};
          // Read the language-key manifest stored on meta (kept in sync by put).
          // If missing (legacy chapters), fall back to probing known keys.
          const langsIndex = meta._langs || ['ru', 'en', 'pt'];
          for (const lang of langsIndex) {
            const t = await LF_TEXT.getItem(`chapter:${id}:${lang}`);
            if (t) versions[lang] = t;
          }
          const esLevels = meta._esLevels || ['A2','B1','B2','C1'];
          const esByLevel = {};
          for (const lvl of esLevels) {
            const t = await LF_TEXT.getItem(`chapter:${id}:es:${lvl}`);
            if (t) esByLevel[lvl] = t;
          }
          if (Object.keys(esByLevel).length) versions.es = esByLevel;
          return { ...meta, sourceText, versions };
        },
        async put(chapter) {
          if (!chapter.id) chapter.id = uid();
          // split text bodies out of meta; also record which langs/levels exist so get() can find them
          const { sourceText, versions, ...meta } = chapter;
          const idx = (await LF_META.getItem(`chapters:${chapter.bookId}`)) || [];
          if (!idx.includes(chapter.id)) { idx.push(chapter.id); await LF_META.setItem(`chapters:${chapter.bookId}`, idx); }

          if (sourceText != null) await LF_TEXT.setItem(`chapter:${chapter.id}:source`, sourceText);
          // Persist any language key in versions (except es which is level-keyed).
          const langsWritten = [];
          const esLevelsWritten = [];
          if (versions) {
            for (const [lang, val] of Object.entries(versions)) {
              if (lang === 'es') {
                if (val && typeof val === 'object') {
                  for (const [lvl, txt] of Object.entries(val)) {
                    if (typeof txt === 'string' && txt.length) {
                      await LF_TEXT.setItem(`chapter:${chapter.id}:es:${lvl}`, txt);
                      esLevelsWritten.push(lvl);
                    }
                  }
                }
              } else if (typeof val === 'string' && val.length) {
                await LF_TEXT.setItem(`chapter:${chapter.id}:${lang}`, val);
                langsWritten.push(lang);
              }
            }
          }
          // Store the language manifest on meta so get() knows which keys to look up.
          // Merge with any prior manifest (don't lose langs from earlier writes).
          const priorMeta = await LF_META.getItem(`chapter:${chapter.id}`);
          const priorLangs = priorMeta?._langs || [];
          const priorEs = priorMeta?._esLevels || [];
          meta._langs = Array.from(new Set([...priorLangs, ...langsWritten]));
          meta._esLevels = Array.from(new Set([...priorEs, ...esLevelsWritten]));
          await LF_META.setItem(`chapter:${chapter.id}`, meta);
          try { CrossTab.post('chapter:put', chapter.id); } catch {}
          return chapter;
        },
        async delete(id) {
          const c = await LF_META.getItem(`chapter:${id}`);
          if (!c) return;
          const idx = ((await LF_META.getItem(`chapters:${c.bookId}`)) || []).filter(x => x !== id);
          await LF_META.setItem(`chapters:${c.bookId}`, idx);
          await LF_META.removeItem(`chapter:${id}`);
          await LF_TEXT.removeItem(`chapter:${id}:source`);
          // Remove any known langs + all ES levels
          const knownLangs = c._langs || ['ru','en','pt'];
          for (const lang of knownLangs) await LF_TEXT.removeItem(`chapter:${id}:${lang}`);
          for (const lvl of (c._esLevels || ['A2','B1','B2','C1'])) await LF_TEXT.removeItem(`chapter:${id}:es:${lvl}`);
          try { CrossTab.post('chapter:delete', id); } catch {}
          // audio blobs cleaned lazily
        }
      },
      vocab: {
        async list(filter = {}) {
          const ids = (await LF_META.getItem('vocab:index')) || [];
          const out = [];
          for (const id of ids) {
            const v = await LF_META.getItem(`vocab:${id}`);
            if (!v) continue;
            if (filter.bookId && v.bookId !== filter.bookId) continue;
            out.push(v);
          }
          return out.sort((a,b) => b.createdAt - a.createdAt);
        },
        async put(entry) {
          if (!entry.id) entry.id = uid();
          if (!entry.createdAt) entry.createdAt = Date.now();
          const ids = (await LF_META.getItem('vocab:index')) || [];
          if (!ids.includes(entry.id)) { ids.push(entry.id); await LF_META.setItem('vocab:index', ids); }
          await LF_META.setItem(`vocab:${entry.id}`, entry);
          try { CrossTab.post('vocab:put', entry.id); } catch {}
          return entry;
        },
        async delete(word, bookId) {
          const list = await Storage.vocab.list({ bookId });
          for (const v of list) {
            if (v.word === word) {
              const ids = ((await LF_META.getItem('vocab:index')) || []).filter(x => x !== v.id);
              await LF_META.setItem('vocab:index', ids);
              await LF_META.removeItem(`vocab:${v.id}`);
            }
          }
        }
      },
      audio: {
        _key(chapterId, sentenceHash, voiceId) { return `${chapterId}:${sentenceHash}:${voiceId}`; },
        async put(chapterId, sentenceHash, voiceId, { blob, timings }) {
          const key = this._key(chapterId, sentenceHash, voiceId);
          await LF_AUDIO.setItem(key, { blob, timings, size: blob.size, ts: Date.now() });
          // update LRU index
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          const filtered = idx.filter(x => x.key !== key);
          filtered.push({ key, ts: Date.now(), size: blob.size });
          await LF_AUDIO.setItem('__lru__', filtered);
        },
        async get(chapterId, sentenceHash, voiceId) {
          const rec = await LF_AUDIO.getItem(this._key(chapterId, sentenceHash, voiceId));
          if (!rec) return null;
          // bump LRU
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).filter(x => x.key !== this._key(chapterId, sentenceHash, voiceId));
          idx.push({ key: this._key(chapterId, sentenceHash, voiceId), ts: Date.now(), size: rec.size });
          await LF_AUDIO.setItem('__lru__', idx);
          return { blob: rec.blob, timings: rec.timings };
        },
        async evictOldest(bytesToFree) {
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).sort((a,b) => a.ts - b.ts);
          let freed = 0;
          const remaining = [];
          for (const entry of idx) {
            if (freed < bytesToFree) {
              await LF_AUDIO.removeItem(entry.key);
              freed += entry.size;
            } else {
              remaining.push(entry);
            }
          }
          await LF_AUDIO.setItem('__lru__', remaining);
          return freed;
        },
        async stats() {
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          return { count: idx.length, bytes: idx.reduce((a,x) => a + x.size, 0) };
        }
      },
      settings: {
        async get(key, def = null) { return (await LF_META.getItem(`setting:${key}`)) ?? def; },
        async set(key, val) { return LF_META.setItem(`setting:${key}`, val); }
      }
    };

    // ============ Router (dead simple) ============
    const routes = {};
    let _currentRouteAbort = null;
    let _currentRoute = null;
    let _currentRouteParams = null;
    function route(name, renderFn) { routes[name] = renderFn; }
    function nav(name, params = {}) {
      if (_currentRouteAbort) { _currentRouteAbort.abort(); _currentRouteAbort = null; }
      window.scrollTo(0,0);
      const el = document.getElementById('app');
      el.innerHTML = '';
      _currentRoute = name;
      _currentRouteParams = params;
      routes[name](el, params);
    }

    // Cross-tab: if another tab wrote a book / chapter / vocab entry, re-render current view.
    // Simple heuristic: refresh whatever route is currently displayed (except reader — playing audio there).
    CrossTab.listen((msg) => {
      if (!_currentRoute) return;
      if (_currentRoute === 'reader') return;   // don't yank the reader mid-play
      // Debounce quick bursts
      clearTimeout(window.__crossTabDebounce);
      window.__crossTabDebounce = setTimeout(() => nav(_currentRoute, _currentRouteParams || {}), 300);
    });

    // ============ Library screen ============
    route('library', async (el) => {
      const books = await Storage.books.list();
      // Load persisted filter/sort
      const savedSearch = await Storage.settings.get('librarySearch', '');
      const savedSort = await Storage.settings.get('librarySort', 'title');
      const applyFilter = (query, sortMode) => {
        const q = (query || '').toLowerCase().trim();
        let filtered = books;
        if (q) filtered = books.filter(b =>
          (b.title || '').toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q) ||
          (b.description || '').toLowerCase().includes(q)
        );
        if (sortMode === 'title') filtered = [...filtered].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        else if (sortMode === 'author') filtered = [...filtered].sort((a, b) => (a.author || '').localeCompare(b.author || ''));
        else if (sortMode === 'recent') filtered = [...filtered].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        else if (sortMode === 'chapters') filtered = [...filtered].sort((a, b) => (b.chapterCount || 0) - (a.chapterCount || 0));
        return filtered;
      };
      const initialFiltered = applyFilter(savedSearch, savedSort);
      const renderCards = (list) => list.length === 0
        ? `<div class="empty"><p>No books match.</p></div>`
        : list.map(b => `
          <article class="book-card" data-id="${escapeHtml(b.id)}">
            <div class="book-actions">
              <button class="book-edit" data-id="${escapeHtml(b.id)}" title="Edit book title, author, description">&#9998;</button>
              <button class="book-delete" data-id="${escapeHtml(b.id)}" title="Delete this book (irreversible)">&#128465;</button>
            </div>
            <h2>${escapeHtml(b.title)}</h2>
            <p class="author">${escapeHtml(b.author || '')}${b.description ? '<br><small>' + escapeHtml(b.description) + '</small>' : ''}</p>
            <p class="meta">${escapeHtml(b.chapterCount ?? 0)} chapters</p>
            <button class="continue" data-id="${escapeHtml(b.id)}">&#9654; Continue</button>
          </article>`).join('');
      el.innerHTML = `
        <header class="topbar"><h1>lector</h1>
          <div class="actions">
            <button id="btn-import">+ Import book</button>
            <button id="btn-vocab">Vocab</button>
            <button id="btn-settings">&#9881;</button>
          </div>
        </header>
        <main class="library">
          ${books.length === 0
            ? `<div class="empty"><p>No books yet.</p><button id="btn-import-2">Import your first book</button></div>`
            : `<div class="search-row">
                 <input class="search-input" id="lib-search" placeholder="Search by title / author / description…" value="${escapeHtml(savedSearch)}">
                 <select class="sort-select" id="lib-sort">
                   <option value="title" ${savedSort==='title'?'selected':''}>Sort: Title</option>
                   <option value="author" ${savedSort==='author'?'selected':''}>Sort: Author</option>
                   <option value="recent" ${savedSort==='recent'?'selected':''}>Sort: Recently added</option>
                   <option value="chapters" ${savedSort==='chapters'?'selected':''}>Sort: Chapter count</option>
                 </select>
               </div>
               <div id="lib-cards">${renderCards(initialFiltered)}</div>`}
        </main>`;
      const wireCards = () => {
        el.querySelectorAll('.book-card').forEach(c => c.addEventListener('click', (ev) => {
          if (ev.target.closest('.book-actions')) return;
          nav('book', { id: c.dataset.id });
        }));
        el.querySelectorAll('.book-edit').forEach(btn => btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          nav('book', { id: btn.dataset.id, edit: true });
        }));
        el.querySelectorAll('.book-delete').forEach(btn => btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const bid = btn.dataset.id;
          const b = books.find(x => x.id === bid);
          const bookLabel = b ? `${b.title}` : 'this book';
          if (!confirm(`Delete "${bookLabel}"? This removes all chapters, translations, cached audio, reading positions, and bookmarks for this book. Vocabulary saved from it stays. Cannot be undone.`)) return;
          btn.disabled = true;
          btn.textContent = '…';
          try {
            await Storage.books.delete(bid);
            nav('library');
          } catch (err) {
            alert('Delete failed: ' + err.message);
            btn.disabled = false;
            btn.textContent = '\u{1F5D1}';
          }
        }));
      };
      // Wire search + sort
      const searchInp = el.querySelector('#lib-search');
      const sortSel = el.querySelector('#lib-sort');
      const cardsBox = el.querySelector('#lib-cards');
      const rerender = async () => {
        const q = searchInp?.value || '';
        const s = sortSel?.value || 'title';
        await Storage.settings.set('librarySearch', q);
        await Storage.settings.set('librarySort', s);
        if (cardsBox) cardsBox.innerHTML = renderCards(applyFilter(q, s));
        wireCards();
      };
      searchInp?.addEventListener('input', rerender);
      sortSel?.addEventListener('change', rerender);
      document.getElementById('btn-import')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-import-2')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-vocab')?.addEventListener('click', () => nav('vocab'));
      document.getElementById('btn-settings')?.addEventListener('click', () => nav('settings'));
      wireCards();
    });


    // ============ splitIntoChapters ============
    const MAX_CHAPTER_CHARS = 25000;  // subdivide larger chunks so single-chapter LLM cost stays bounded

    function subdivideOversized(chapters) {
      const out = [];
      for (const c of chapters) {
        if (!c.sourceText || c.sourceText.length <= MAX_CHAPTER_CHARS) { out.push(c); continue; }
        // Split by paragraph boundary, accumulate up to MAX_CHAPTER_CHARS
        const paras = c.sourceText.split(/\n{2,}/);
        let buf = [], bufLen = 0, partNum = 0;
        const flush = () => {
          if (!buf.length) return;
          partNum++;
          out.push({
            title: `${c.title} (Part ${partNum})`,
            sourceText: buf.join('\n\n'),
            ...(c.frontMatter ? { frontMatter: true } : {})
          });
          buf = []; bufLen = 0;
        };
        for (const p of paras) {
          if (bufLen + p.length > MAX_CHAPTER_CHARS && buf.length) flush();
          buf.push(p); bufLen += p.length + 2;
        }
        flush();
      }
      return out;
    }

    function splitIntoChapters(text) {
      const lines = text.split(/\r?\n/);
      // Try heuristics in order; first that yields >=2 chapters wins.
      const heuristics = [
        { name: 'md-h2', re: /^##\s+(.+)$/ },
        { name: 'md-h3', re: /^###\s+(.+)$/ },
        { name: 'chapter-word', re: /^\s*(Глава|ГЛАВА|Часть|ЧАСТЬ|Chapter|CHAPTER|Capítulo|CAPÍTULO)\s+([IVXLCDM\d]+)(?:\s*[.:—-]?\s*(.*))?$/ }
      ];

      let chapters = null;
      for (const h of heuristics) {
        const cuts = [];
        lines.forEach((line, i) => { const m = h.re.exec(line); if (m) cuts.push({ i, title: m[0].replace(/^#+\s*/, '').trim() }); });
        if (cuts.length >= 2) {
          chapters = [];
          for (let k = 0; k < cuts.length; k++) {
            const start = cuts[k].i;
            const end = cuts[k+1] ? cuts[k+1].i : lines.length;
            const body = lines.slice(start + 1, end).join('\n').trim();
            chapters.push({ title: cuts[k].title, sourceText: body });
          }
          const prelude = lines.slice(0, cuts[0].i).join('\n').trim();
          if (prelude.length > 500) chapters.unshift({ title: '(Front matter)', sourceText: prelude, frontMatter: true });
          break;
        }
      }
      if (!chapters) chapters = [{ title: 'Chapter 1', sourceText: text.trim() }];
      // Auto-subdivide any chapter body that exceeds the cost/latency budget
      return subdivideOversized(chapters);
    }
    window.splitIntoChapters = splitIntoChapters;

    // ============ Sentence / paragraph splitters ============
    function splitSentences(text) {
      // Prefer Intl.Segmenter if available
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter('es', { granularity: 'sentence' });
          return [...seg.segment(text)].map(s => s.segment.trim()).filter(Boolean);
        } catch {}
      }
      // Regex fallback: sentence-terminal punctuation followed by whitespace
      return text.split(/(?<=[.!?…])\s+(?=[A-ZА-ЯÁÉÍÓÚÑ¿¡])/).map(s => s.trim()).filter(Boolean);
    }

    function splitParagraphs(text) {
      return text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    }

    // ============ TTS helpers ============
    async function sentenceHash(s) {
      const buf = new TextEncoder().encode(s);
      const digest = await crypto.subtle.digest('SHA-1', buf);
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 16);
    }

    function base64ToBlob(b64, type = 'audio/mpeg') {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    // Voice a chapter in a specific language + level.
    // targetLang: 'es' | 'ru' | 'en'   |   level: 'A2'|'B1'|'B2'|'C1' (only used when targetLang='es')
    // Cache key format: `${lang}` for RU/EN, `${lang}_${level}` for ES.
    // Server picks appropriate voice via lang hint.
    function voiceKey(targetLang, level) {
      return targetLang === 'es' ? `es_${level || 'B1'}` : targetLang;
    }

    function bodyForLang(chapter, targetLang, level) {
      if (targetLang === 'es') return chapter.versions?.es?.[level || 'B1'];
      return chapter.versions?.[targetLang];
    }

    async function voiceChapter(chapter, book, targetLang, level, onProgress) {
      const bodyText = bodyForLang(chapter, targetLang, level);
      if (!bodyText) throw new Error(`no ${targetLang}${targetLang==='es' ? ' '+level : ''} text — generate/import it first`);
      const sentences = splitParagraphs(bodyText).flatMap(splitSentences);
      const key = voiceKey(targetLang, level);
      let prevReqIds = [];
      for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        const hash = await sentenceHash(s + '|' + key);
        const existing = await Storage.audio.get(chapter.id, hash, key);
        if (existing) { onProgress?.(i + 1, sentences.length); continue; }
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            text: s,
            model: 'multilingual_v2',
            voice: 'narrator',
            lang: targetLang,
            withTimestamps: true,
            previousRequestIds: prevReqIds.slice(-3)
          })
        });
        let j = null;
        try { j = await r.json(); } catch {}
        if (!r.ok || !j?.audioBase64) {
          const detail = j?.error || j?.detail || `HTTP ${r.status}`;
          throw new Error(`tts failed at sentence ${i}: ${detail}`);
        }
        const blob = base64ToBlob(j.audioBase64);
        await Storage.audio.put(chapter.id, hash, key, { blob, timings: j.timings });
        if (j.requestId) prevReqIds.push(j.requestId);
        onProgress?.(i + 1, sentences.length);
      }
      onProgress?.(sentences.length, sentences.length);
      const updated = await Storage.chapters.get(chapter.id);
      updated.voiced = { ...(updated.voiced || {}), [key]: true };
      await Storage.chapters.put(updated);
    }

    // ============ Recognition helpers ============
    function normalizeWords(s) {
      return s.toLowerCase().replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').split(/\s+/).filter(Boolean);
    }

    async function reciteSentence(sentEl, expected, lang) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('SpeechRecognition not supported in this browser'); return; }
      const rec = new SR();
      rec.lang = lang === 'es' ? 'es-ES' : lang === 'ru' ? 'ru-RU' : 'en-GB';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      sentEl.classList.add('reciting');
      rec.start();
      rec.onresult = (ev) => {
        const heard = ev.results[0][0].transcript;
        const want = normalizeWords(expected);
        const got = normalizeWords(heard);
        const matched = new Set();
        got.forEach(g => { const i = want.indexOf(g); if (i >= 0 && !matched.has(i)) matched.add(i); });
        const score = Math.round(100 * matched.size / want.length);
        // annotate sentence: rebuild spans with color classes
        const spans = [...sentEl.querySelectorAll('.w')];
        let wi = 0;
        spans.forEach(sp => {
          const w = sp.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g,'').toLowerCase().trim();
          if (!w) return;
          sp.classList.remove('r-hit','r-miss');
          sp.classList.add(matched.has(wi) ? 'r-hit' : 'r-miss');
          wi++;
        });
        sentEl.classList.remove('reciting');
        const badge = document.createElement('span'); badge.className = 'r-score'; badge.textContent = ' ' + score + '%';
        sentEl.appendChild(badge);
        setTimeout(() => {
          spans.forEach(sp => sp.classList.remove('r-hit','r-miss'));
          badge.remove();
        }, 5000);
      };
      rec.onerror = () => sentEl.classList.remove('reciting');
      rec.onend = () => sentEl.classList.remove('reciting');
    }

    // ============ RWL Playback Engine ============
    // Language-aware: reads audio from cache keyed by voiceKey(targetLang, level).
    // Also supports loop modes (off/sentence/paragraph) and cross-chapter continuous playback.
    const Player = {
      audioEl: null, chapter: null, book: null, sentences: [], sentenceParaIdx: [],
      key: null, targetLang: null, level: null, idx: 0, timings: [], speed: 1,
      loopMode: 'off',     // 'off' | 'sentence' | 'paragraph'
      continuous: false,   // auto-advance to next chapter at end
      saveTimer: null,
      progressCb: null,    // (idx, total) called on every advance for UI
      chapterEndCb: null,  // callback when chapter finishes (for continuous flow)
      async start(chapter, book, targetLang, level, fromIdx = 0) {
        this.stop();
        // Kill any orphan ephemeral audio too — otherwise word/sentence popover audio would play in parallel with RWL.
        if (typeof EphemeralAudio !== 'undefined') EphemeralAudio.stop();
        const key = voiceKey(targetLang, level);
        if (!chapter.voiced?.[key]) {
          console.warn('[Player] chapter not voiced for', key);
          return;
        }
        const body = bodyForLang(chapter, targetLang, level);
        if (!body) { console.warn('[Player] no body text for', targetLang, level); return; }
        this.chapter = chapter; this.book = book;
        this.key = key; this.targetLang = targetLang; this.level = level;
        // Build sentence list AND per-sentence paragraph index (for loop-paragraph)
        this.sentences = [];
        this.sentenceParaIdx = [];
        splitParagraphs(body).forEach((p, pi) => {
          splitSentences(p).forEach(s => {
            this.sentences.push(s);
            this.sentenceParaIdx.push(pi);
          });
        });
        this.idx = Math.max(0, Math.min(fromIdx, this.sentences.length - 1));
        this.audioEl = new Audio();
        this.audioEl.playbackRate = this.speed;
        this.audioEl.addEventListener('ended', () => this._onSentenceEnd());
        this.audioEl.addEventListener('timeupdate', () => this._highlightWord());
        this._play().catch(err => { console.error('[Player]', err); this.stop(); });
        this.saveTimer = setInterval(() => this._savePos(), 5000);
      },
      async _play() {
        if (this.idx >= this.sentences.length) return this._onChapterEnd();
        const s = this.sentences[this.idx];
        const hash = await sentenceHash(s + '|' + this.key);
        const rec = await Storage.audio.get(this.chapter.id, hash, this.key);
        if (!rec) { console.warn('[Player] missing audio for sentence', this.idx, 'key', this.key); return this._next(); }
        this.timings = rec.timings || [];
        if (this.audioEl.src) URL.revokeObjectURL(this.audioEl.src);
        this.audioEl.src = URL.createObjectURL(rec.blob);
        document.querySelectorAll('.sent.playing').forEach(x => x.classList.remove('playing'));
        const sentEl = document.querySelector(`.sent[data-sent="${this.idx}"]`);
        if (sentEl) { sentEl.classList.add('playing'); sentEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        this.progressCb?.(this.idx, this.sentences.length);
        await this.audioEl.play();
      },
      // Sentence just finished — decide next action based on loopMode.
      _onSentenceEnd() {
        if (this.loopMode === 'sentence') {
          // Repeat current
          this._play().catch(err => { console.error('[Player]', err); this.stop(); });
          return;
        }
        if (this.loopMode === 'paragraph') {
          const curPara = this.sentenceParaIdx[this.idx];
          const nextIdx = this.idx + 1;
          if (nextIdx >= this.sentences.length || this.sentenceParaIdx[nextIdx] !== curPara) {
            // We just finished the last sentence of this paragraph — jump back to first sentence of same paragraph
            let firstOfPara = this.idx;
            while (firstOfPara > 0 && this.sentenceParaIdx[firstOfPara - 1] === curPara) firstOfPara--;
            this.idx = firstOfPara;
            this._play().catch(err => { console.error('[Player]', err); this.stop(); });
            return;
          }
          // Otherwise fall through to normal next
        }
        this._next();
      },
      _next() { this.idx++; this._savePos(); this._play().catch(err => { console.error('[Player]', err); this.stop(); }); },
      // End of chapter reached — handle continuous cross-chapter flow.
      async _onChapterEnd() {
        const cb = this.chapterEndCb;
        this.stop();
        if (cb && this.continuous !== false) {
          try { await cb(); } catch (err) { console.warn('[Player] chapterEndCb failed', err); }
        }
      },
      setLoopMode(mode) { this.loopMode = mode; },
      setContinuous(b) { this.continuous = b; },
      _highlightWord() {
        if (!this.audioEl) return;   // guard: stop() may have nulled audioEl mid-fire
        const t = this.audioEl.currentTime;
        const w = this.timings.find(x => t >= x.startSec && t <= x.endSec);
        document.querySelectorAll('.wnow').forEach(x => x.classList.remove('wnow'));
        if (!w) return;
        const sentEl = document.querySelector('.sent.playing');
        if (!sentEl) return;
        const spans = [...sentEl.querySelectorAll('.w')];
        const hit = spans.find(sp => sp.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').trim().toLowerCase() === w.word.toLowerCase());
        if (hit) hit.classList.add('wnow');
      },
      setSpeed(s) { this.speed = s; if (this.audioEl) this.audioEl.playbackRate = s; },
      async _savePos() {
        if (!this.chapter) return;
        const ch = await Storage.chapters.get(this.chapter.id);
        if (!ch) return;
        ch.playbackResume = { sentenceIndex: this.idx, audioTimeSec: this.audioEl?.currentTime || 0, key: this.key };
        ch.positionFraction = this.sentences.length ? this.idx / this.sentences.length : 0;
        await Storage.chapters.put({ ...ch, sourceText: ch.sourceText });
      },
      pause() { this.audioEl?.pause(); this._savePos(); },
      resume() { this.audioEl?.play(); },
      prev() {
        if (!this.chapter || this.idx <= 0) return;
        this.idx = Math.max(0, this.idx - 1);
        this._play().catch(err => console.error('[Player]', err));
      },
      skipNext() {
        if (!this.chapter || this.idx >= this.sentences.length - 1) return;
        this.idx++;
        this._play().catch(err => console.error('[Player]', err));
      },
      stop() {
        if (this.saveTimer) { clearInterval(this.saveTimer); this.saveTimer = null; }
        if (this.audioEl) { this.audioEl.pause(); if (this.audioEl.src) { URL.revokeObjectURL(this.audioEl.src); } this.audioEl = null; }
        document.querySelectorAll('.sent.playing, .wnow').forEach(x => x.classList.remove('playing', 'wnow'));
        this.chapter = null; this.book = null; this.sentences = []; this.sentenceParaIdx = []; this.timings = []; this.idx = 0; this.key = null; this.targetLang = null; this.level = null;
        // NOTE: preserve loopMode + continuous + speed + callbacks — they're user-session preferences
        // Also nuke any orphan ephemeral audio so the ⏹ button truly stops EVERYTHING
        if (typeof EphemeralAudio !== 'undefined') EphemeralAudio.stop();
      },
      isPlaying() { return !!(this.audioEl && !this.audioEl.paused); },
      isAnythingPlaying() {
        return this.isPlaying() || !!(typeof EphemeralAudio !== 'undefined' && EphemeralAudio.audioEl && !EphemeralAudio.audioEl.paused);
      }
    };
    window.Player = Player;   // expose for E2E + debugging

    // Ephemeral audio singleton — holds the one-off Audio element used by playWord/playSentence.
    // Ensures we never leave an orphaned Audio running when starting a new one.
    const EphemeralAudio = {
      audioEl: null,
      _stopHandler: null,
      stop() {
        if (this.audioEl) {
          try { this.audioEl.pause(); } catch {}
          if (this._stopHandler) {
            this.audioEl.removeEventListener('timeupdate', this._stopHandler);
            this._stopHandler = null;
          }
          if (this.audioEl.src) { try { URL.revokeObjectURL(this.audioEl.src); } catch {} }
          this.audioEl = null;
        }
      },
      set(audio, stopHandler = null) {
        this.stop();
        this.audioEl = audio;
        this._stopHandler = stopHandler;
      }
    };

    // Kills ALL active playback — the RWL Player AND any ephemeral audio.
    // Used before starting any new playback so nothing plays in parallel and the stop button is authoritative.
    function stopAllPlayback() {
      try { Player.stop(); } catch {}
      EphemeralAudio.stop();
      // Also clear any leftover visual highlight from either source
      document.querySelectorAll('.sent.playing, .wnow').forEach(x => x.classList.remove('playing', 'wnow'));
    }

    // Play just ONE word — prefers cached sentence audio (seek+stop between timings), falls back to Flash TTS.
    // Always stops any current playback first so there's never parallel audio.
    async function playWord(chapterId, sentence, wordText, voiceKeyStr, lang) {
      stopAllPlayback();
      const clean = wordText.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').toLowerCase().trim();
      if (!clean) return;
      // Try cached slice first
      try {
        const hash = await sentenceHash(sentence + '|' + voiceKeyStr);
        const rec = await Storage.audio.get(chapterId, hash, voiceKeyStr);
        if (rec && rec.timings) {
          const w = rec.timings.find(t => (t.word || '').toLowerCase() === clean);
          if (w && typeof w.startSec === 'number' && typeof w.endSec === 'number') {
            const audio = new Audio(URL.createObjectURL(rec.blob));
            audio.currentTime = w.startSec;
            const endTime = w.endSec + 0.05;
            const onTime = () => {
              if (audio.currentTime >= endTime) EphemeralAudio.stop();
            };
            audio.addEventListener('timeupdate', onTime);
            EphemeralAudio.set(audio, onTime);
            await audio.play();
            return;
          }
        }
      } catch (err) { console.warn('[playWord] cache slice failed', err); }
      // Fallback: Flash TTS for single word
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: clean, model: 'flash_v2_5', voice: 'narrator', lang, withTimestamps: false })
      });
      if (!r.ok) return;
      const blob = await r.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      EphemeralAudio.set(audio);
      audio.play();
    }

    // Play arbitrary text (sentence / paragraph / anything) via Flash TTS in the given lang.
    // Always stops any current playback first so there's never parallel audio.
    async function playSentence(text, lang) {
      stopAllPlayback();
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, model: 'flash_v2_5', voice: 'narrator', lang, withTimestamps: false })
      });
      if (!r.ok) return;
      const blob = await r.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      EphemeralAudio.set(audio);
      audio.play();
    }
