<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --serif: 'Literata', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;

      /* Colors */
      --fg:      #1a1a1a;
      --fg-muted:#555;
      --bg:      #fafaf8;
      --bg-card: #fff;
      --accent:  #2d6a4f;
      --accent-h:#1b4332;
      --border:  #e4e4e0;

      /* Spacing scale */
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;
      --sp-12: 3rem;

      /* Layout */
      --max-w: 52rem;
      --radius: 10px;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-6);
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .topbar .actions {
      display: flex;
      gap: var(--sp-2);
      align-items: center;
    }

    /* ===== Buttons ===== */
    button {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: var(--sp-2) var(--sp-4);
      transition: background 0.15s, color 0.15s;
    }
    button.primary, #btn-import, #btn-import-2 {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover, #btn-import:hover, #btn-import-2:hover {
      background: var(--accent-h);
    }
    button.ghost {
      background: transparent;
      color: var(--fg-muted);
    }
    button.ghost:hover {
      background: var(--border);
      color: var(--fg);
    }
    #btn-vocab, #btn-settings {
      background: transparent;
      color: var(--fg-muted);
      padding: var(--sp-2) var(--sp-3);
    }
    #btn-vocab:hover, #btn-settings:hover {
      background: var(--border);
      color: var(--fg);
    }

    /* ===== Library grid ===== */
    .library {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
      gap: var(--sp-6);
    }

    /* ===== Book card ===== */
    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .book-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .book-card h2 {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .book-card .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
    }
    .book-card .meta {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: auto;
    }
    .book-card .continue {
      margin-top: var(--sp-4);
      background: var(--accent);
      color: #fff;
      align-self: flex-start;
      padding: var(--sp-2) var(--sp-4);
    }
    .book-card .continue:hover { background: var(--accent-h); }

    /* ===== Empty state ===== */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--sp-12) var(--sp-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-6);
    }
    .empty p {
      font-size: 1.125rem;
      color: var(--fg-muted);
    }
    .empty button {
      font-size: 1rem;
      padding: var(--sp-3) var(--sp-8);
    }

    /* ===== Stub screens ===== */
    .stub {
      max-width: var(--max-w);
      margin: var(--sp-8) auto;
      padding: 0 var(--sp-6);
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .stub button { margin-top: var(--sp-4); }

    /* ===== Book detail ===== */
    .book-detail {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-6);
    }
    .book-detail .author {
      font-size: 0.875rem;
      color: var(--fg-muted);
      margin-top: var(--sp-1);
    }
    .chapters {
      list-style: none;
      margin-top: var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .chapters li {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .chapters li:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .ch-idx {
      font-size: 0.75rem;
      color: var(--fg-muted);
      min-width: 1.5rem;
      text-align: right;
    }
    .ch-title {
      flex: 1;
      font-family: var(--serif);
      font-size: 0.95rem;
    }
    .chips {
      display: flex;
      gap: var(--sp-1);
      flex-shrink: 0;
    }
    .chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
    }

    /* ===== Reader ===== */
    .reader-topbar {
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .crumbs {
      flex: 1;
      font-size: 0.875rem;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pills {
      display: flex;
      gap: 4px;
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--fg-muted);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .pill.active {
      background: var(--accent);
      color: #fff;
    }
    .pill:hover:not(.active) {
      background: #d5e8de;
      color: var(--accent);
    }
    .play-btn {
      background: transparent;
      color: var(--fg-muted);
      padding: var(--sp-2) var(--sp-3);
      opacity: 0.4;
      cursor: default;
    }
    .reader {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--sp-8) var(--sp-6);
      font-family: var(--serif);
      font-size: 1.125rem;
      line-height: 1.8;
    }
    .reader p {
      margin-bottom: var(--sp-6);
    }
    .sent {
      border-radius: 3px;
    }
    .sent:hover {
      background: rgba(45,106,79,0.08);
    }
    .reader .empty {
      grid-column: unset;
      text-align: left;
    }
    .reader .empty p {
      font-family: var(--serif);
      color: var(--fg-muted);
    }
    .reader .empty button {
      margin-top: var(--sp-4);
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== Word popover ===== */
    #popover { position: absolute; z-index: 100; background: var(--bg); border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 320px; font-family: var(--sans); font-size: 14px; }
    .pop-word { font-size: 16px; margin-bottom: 4px; }
    .pop-lemma { color: #888; font-size: 13px; font-style: italic; }
    .pop-gloss { margin: 8px 0; }
    .pop-note { color: #555; font-size: 13px; }
    .pop-actions { margin-top: 10px; display: flex; gap: 8px; }
    .w { cursor: pointer; }
    .w:hover { background: #fffbe0; }

    /* ===== Breakdown (Frank-style) ===== */
    .breakdown { background: #f7f4ee; border-left: 3px solid #b89b62; padding: 10px 14px; margin: 6px 0 12px; font-family: var(--sans); font-size: 14px; position: relative; }
    .bd-ch { display: inline-block; margin-right: 6px; }
    .bd-g { color: #7a6b48; font-style: italic; font-size: 12px; }
    .bd-clean { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d7c99a; }
    .bd-close { position: absolute; top: 6px; right: 8px; background: transparent; border: 0; cursor: pointer; font-size: 14px; }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .topbar { padding: var(--sp-3) var(--sp-4); }
      .library { padding: var(--sp-6) var(--sp-4); gap: var(--sp-4); }
      .topbar h1 { font-size: 1.25rem; }
      .reader { padding: var(--sp-6) var(--sp-4); font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script>
    // ============ Storage ============
    const LF_META  = localforage.createInstance({ name: 'lector', storeName: 'meta' });
    const LF_TEXT  = localforage.createInstance({ name: 'lector', storeName: 'text' });
    const LF_AUDIO = localforage.createInstance({ name: 'lector', storeName: 'audio' });

    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    const Storage = {
      books: {
        async list() {
          const ids = (await LF_META.getItem('books:index')) || [];
          const out = [];
          for (const id of ids) {
            const b = await LF_META.getItem(`book:${id}`);
            if (b) out.push(b);
          }
          return out;
        },
        async get(id) { return LF_META.getItem(`book:${id}`); },
        async put(book) {
          if (!book.id) book.id = uid();
          const ids = (await LF_META.getItem('books:index')) || [];
          if (!ids.includes(book.id)) { ids.push(book.id); await LF_META.setItem('books:index', ids); }
          await LF_META.setItem(`book:${book.id}`, book);
          return book;
        },
        async delete(id) {
          const ids = ((await LF_META.getItem('books:index')) || []).filter(x => x !== id);
          await LF_META.setItem('books:index', ids);
          await LF_META.removeItem(`book:${id}`);
          // cascade chapters
          const chIdx = (await LF_META.getItem(`chapters:${id}`)) || [];
          for (const cid of chIdx) await Storage.chapters.delete(cid);
          await LF_META.removeItem(`chapters:${id}`);
        }
      },
      chapters: {
        async list(bookId) {
          const idx = (await LF_META.getItem(`chapters:${bookId}`)) || [];
          const out = [];
          for (const cid of idx) {
            const c = await LF_META.getItem(`chapter:${cid}`);
            if (c) out.push(c);
          }
          return out.sort((a,b) => a.index - b.index);
        },
        async get(id) {
          const meta = await LF_META.getItem(`chapter:${id}`);
          if (!meta) return null;
          const sourceText = await LF_TEXT.getItem(`chapter:${id}:source`);
          const versions = {};
          for (const lang of ['ru','en']) {
            const t = await LF_TEXT.getItem(`chapter:${id}:${lang}`);
            if (t) versions[lang] = t;
          }
          const esByLevel = {};
          for (const lvl of ['A2','B1','B2','C1']) {
            const t = await LF_TEXT.getItem(`chapter:${id}:es:${lvl}`);
            if (t) esByLevel[lvl] = t;
          }
          if (Object.keys(esByLevel).length) versions.es = esByLevel;
          return { ...meta, sourceText, versions };
        },
        async put(chapter) {
          if (!chapter.id) chapter.id = uid();
          // split text bodies out of meta
          const { sourceText, versions, ...meta } = chapter;
          const idx = (await LF_META.getItem(`chapters:${chapter.bookId}`)) || [];
          if (!idx.includes(chapter.id)) { idx.push(chapter.id); await LF_META.setItem(`chapters:${chapter.bookId}`, idx); }
          await LF_META.setItem(`chapter:${chapter.id}`, meta);
          if (sourceText != null) await LF_TEXT.setItem(`chapter:${chapter.id}:source`, sourceText);
          if (versions) {
            if (versions.ru) await LF_TEXT.setItem(`chapter:${chapter.id}:ru`, versions.ru);
            if (versions.en) await LF_TEXT.setItem(`chapter:${chapter.id}:en`, versions.en);
            if (versions.es) {
              for (const [lvl, txt] of Object.entries(versions.es)) {
                await LF_TEXT.setItem(`chapter:${chapter.id}:es:${lvl}`, txt);
              }
            }
          }
          return chapter;
        },
        async delete(id) {
          const c = await LF_META.getItem(`chapter:${id}`);
          if (!c) return;
          const idx = ((await LF_META.getItem(`chapters:${c.bookId}`)) || []).filter(x => x !== id);
          await LF_META.setItem(`chapters:${c.bookId}`, idx);
          await LF_META.removeItem(`chapter:${id}`);
          for (const suffix of ['source','ru','en','es:A2','es:B1','es:B2','es:C1']) {
            await LF_TEXT.removeItem(`chapter:${id}:${suffix}`);
          }
          // audio blobs cleaned lazily
        }
      },
      vocab: {
        async list(filter = {}) {
          const ids = (await LF_META.getItem('vocab:index')) || [];
          const out = [];
          for (const id of ids) {
            const v = await LF_META.getItem(`vocab:${id}`);
            if (!v) continue;
            if (filter.bookId && v.bookId !== filter.bookId) continue;
            out.push(v);
          }
          return out.sort((a,b) => b.createdAt - a.createdAt);
        },
        async put(entry) {
          if (!entry.id) entry.id = uid();
          if (!entry.createdAt) entry.createdAt = Date.now();
          const ids = (await LF_META.getItem('vocab:index')) || [];
          if (!ids.includes(entry.id)) { ids.push(entry.id); await LF_META.setItem('vocab:index', ids); }
          await LF_META.setItem(`vocab:${entry.id}`, entry);
          return entry;
        },
        async delete(word, bookId) {
          const list = await Storage.vocab.list({ bookId });
          for (const v of list) {
            if (v.word === word) {
              const ids = ((await LF_META.getItem('vocab:index')) || []).filter(x => x !== v.id);
              await LF_META.setItem('vocab:index', ids);
              await LF_META.removeItem(`vocab:${v.id}`);
            }
          }
        }
      },
      audio: {
        _key(chapterId, sentenceHash, voiceId) { return `${chapterId}:${sentenceHash}:${voiceId}`; },
        async put(chapterId, sentenceHash, voiceId, { blob, timings }) {
          const key = this._key(chapterId, sentenceHash, voiceId);
          await LF_AUDIO.setItem(key, { blob, timings, size: blob.size, ts: Date.now() });
          // update LRU index
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          const filtered = idx.filter(x => x.key !== key);
          filtered.push({ key, ts: Date.now(), size: blob.size });
          await LF_AUDIO.setItem('__lru__', filtered);
        },
        async get(chapterId, sentenceHash, voiceId) {
          const rec = await LF_AUDIO.getItem(this._key(chapterId, sentenceHash, voiceId));
          if (!rec) return null;
          // bump LRU
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).filter(x => x.key !== this._key(chapterId, sentenceHash, voiceId));
          idx.push({ key: this._key(chapterId, sentenceHash, voiceId), ts: Date.now(), size: rec.size });
          await LF_AUDIO.setItem('__lru__', idx);
          return { blob: rec.blob, timings: rec.timings };
        },
        async evictOldest(bytesToFree) {
          const idx = ((await LF_AUDIO.getItem('__lru__')) || []).sort((a,b) => a.ts - b.ts);
          let freed = 0;
          const remaining = [];
          for (const entry of idx) {
            if (freed < bytesToFree) {
              await LF_AUDIO.removeItem(entry.key);
              freed += entry.size;
            } else {
              remaining.push(entry);
            }
          }
          await LF_AUDIO.setItem('__lru__', remaining);
          return freed;
        },
        async stats() {
          const idx = (await LF_AUDIO.getItem('__lru__')) || [];
          return { count: idx.length, bytes: idx.reduce((a,x) => a + x.size, 0) };
        }
      },
      settings: {
        async get(key, def = null) { return (await LF_META.getItem(`setting:${key}`)) ?? def; },
        async set(key, val) { return LF_META.setItem(`setting:${key}`, val); }
      }
    };

    // ============ Router (dead simple) ============
    const routes = {};
    let _currentRouteAbort = null;
    function route(name, renderFn) { routes[name] = renderFn; }
    function nav(name, params = {}) {
      if (_currentRouteAbort) { _currentRouteAbort.abort(); _currentRouteAbort = null; }
      window.scrollTo(0,0);
      const el = document.getElementById('app');
      el.innerHTML = '';
      routes[name](el, params);
    }

    // ============ Library screen ============
    route('library', async (el) => {
      const books = await Storage.books.list();
      el.innerHTML = `
        <header class="topbar"><h1>lector</h1>
          <div class="actions">
            <button id="btn-import">+ Import book</button>
            <button id="btn-vocab">Vocab</button>
            <button id="btn-settings">&#9881;</button>
          </div>
        </header>
        <main class="library">
          ${books.length === 0
            ? `<div class="empty"><p>No books yet.</p><button id="btn-import-2">Import your first book</button></div>`
            : books.map(b => `
              <article class="book-card" data-id="${b.id}">
                <h2>${escapeHtml(b.title)}</h2>
                <p class="author">${escapeHtml(b.author || '')}</p>
                <p class="meta">${escapeHtml(b.chapterCount ?? 0)} chapters</p>
                <button class="continue" data-id="${b.id}">&#9654; Continue</button>
              </article>`).join('')}
        </main>`;
      document.getElementById('btn-import')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-import-2')?.addEventListener('click', () => nav('import'));
      document.getElementById('btn-vocab')?.addEventListener('click', () => nav('vocab'));
      document.getElementById('btn-settings')?.addEventListener('click', () => nav('settings'));
      el.querySelectorAll('.book-card').forEach(c => c.addEventListener('click', () => nav('book', { id: c.dataset.id })));
    });

    // ============ splitIntoChapters ============
    function splitIntoChapters(text) {
      const lines = text.split(/\r?\n/);
      // Try heuristics in order; first that yields >=2 chapters wins.
      const heuristics = [
        { name: 'md-h2', re: /^##\s+(.+)$/ },
        { name: 'md-h3', re: /^###\s+(.+)$/ },
        { name: 'chapter-word', re: /^\s*(Глава|ГЛАВА|Часть|ЧАСТЬ|Chapter|CHAPTER|Capítulo|CAPÍTULO)\s+([IVXLCDM\d]+)(?:\s*[.:—-]?\s*(.*))?$/ }
      ];

      for (const h of heuristics) {
        const cuts = [];
        lines.forEach((line, i) => { const m = h.re.exec(line); if (m) cuts.push({ i, title: m[0].replace(/^#+\s*/, '').trim() }); });
        if (cuts.length >= 2) {
          const chapters = [];
          for (let k = 0; k < cuts.length; k++) {
            const start = cuts[k].i;
            const end = cuts[k+1] ? cuts[k+1].i : lines.length;
            const body = lines.slice(start + 1, end).join('\n').trim();
            chapters.push({ title: cuts[k].title, sourceText: body });
          }
          // Prepend front-matter as its own chapter if content exists before first cut
          const prelude = lines.slice(0, cuts[0].i).join('\n').trim();
          if (prelude.length > 500) chapters.unshift({ title: '(Front matter)', sourceText: prelude, frontMatter: true });
          return chapters;
        }
      }
      // Fallback: no chapters detected, whole thing is one chapter
      return [{ title: 'Chapter 1', sourceText: text.trim() }];
    }
    window.splitIntoChapters = splitIntoChapters;

    // ============ Sentence / paragraph splitters ============
    function splitSentences(text) {
      // Prefer Intl.Segmenter if available
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter('es', { granularity: 'sentence' });
          return [...seg.segment(text)].map(s => s.segment.trim()).filter(Boolean);
        } catch {}
      }
      // Regex fallback: sentence-terminal punctuation followed by whitespace
      return text.split(/(?<=[.!?…])\s+(?=[A-ZА-ЯÁÉÍÓÚÑ¿¡])/).map(s => s.trim()).filter(Boolean);
    }

    function splitParagraphs(text) {
      return text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    }

    // ============ Import screen ============
    route('import', async (el) => {
      el.innerHTML = `
        <header class="topbar"><button onclick="nav('library')">← Back</button><h1>Import book</h1></header>
        <main class="import">
          <section class="import-source">
            <h3>Source</h3>
            <div class="tabs">
              <button class="tab active" data-tab="paste">Paste text</button>
              <button class="tab" data-tab="upload">Upload .txt</button>
              <button class="tab" data-tab="bundled">Bundled</button>
            </div>
            <div class="tab-body" data-body="paste"><textarea id="in-paste" rows="10" placeholder="Paste book text..."></textarea></div>
            <div class="tab-body" data-body="upload" hidden><input type="file" id="in-file" accept=".txt"></div>
            <div class="tab-body" data-body="bundled" hidden>
              <select id="in-bundled">
                <option value="">— pick —</option>
                <option value="/books/gampopa.txt">Гампопа — Драгоценное украшение освобождения</option>
                <option value="/books/patrul.txt">Патрул Ринпоче — Слова моего всеблагого учителя</option>
                <option value="/books/emptiness.txt">Кхенпо Цультрим Гьямцо — Последовательные стадии медитации на пустотность</option>
              </select>
            </div>
          </section>
          <section class="import-meta">
            <label>Title <input id="in-title"></label>
            <label>Author <input id="in-author"></label>
            <label>Source language
              <select id="in-lang"><option value="ru">Russian</option><option value="en">English</option><option value="es">Spanish</option></select>
            </label>
            <button id="in-detect">Detect chapters →</button>
          </section>
          <section id="import-preview" hidden>
            <h3>Chapters</h3>
            <ol id="chapter-list"></ol>
            <button id="in-confirm">Confirm import</button>
          </section>
        </main>`;

      // tab switching
      el.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
        el.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
        el.querySelectorAll('.tab-body').forEach(b => b.hidden = b.dataset.body !== t.dataset.tab);
      }));

      let detectedChapters = [];

      async function getSourceText() {
        const active = el.querySelector('.tab.active').dataset.tab;
        if (active === 'paste') return document.getElementById('in-paste').value;
        if (active === 'upload') {
          const f = document.getElementById('in-file').files[0];
          if (!f) return '';
          return await f.text();
        }
        if (active === 'bundled') {
          const url = document.getElementById('in-bundled').value;
          if (!url) return '';
          const r = await fetch(url);
          return await r.text();
        }
        return '';
      }

      function renderChapterList() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = detectedChapters.map((c, i) => `
          <li data-i="${i}">
            <input type="checkbox" ${c.frontMatter ? '' : 'checked'} class="ch-include">
            <input class="ch-title" value="${escapeHtml(c.title || '')}">
            <span class="ch-size">${c.sourceText.length.toLocaleString()} chars</span>
            <button class="ch-merge-prev" ${i === 0 ? 'disabled' : ''} title="Merge with previous">⇧ merge</button>
          </li>`).join('');
        list.querySelectorAll('.ch-merge-prev').forEach(btn => btn.addEventListener('click', (e) => {
          const i = parseInt(e.target.closest('li').dataset.i);
          if (i === 0) return;
          const prev = detectedChapters[i - 1];
          prev.sourceText = prev.sourceText + '\n\n' + detectedChapters[i].sourceText;
          detectedChapters.splice(i, 1);
          renderChapterList();
        }));
        document.getElementById('import-preview').hidden = false;
      }

      document.getElementById('in-detect').addEventListener('click', async () => {
        const text = await getSourceText();
        if (!text) return alert('No source text');
        detectedChapters = splitIntoChapters(text);
        renderChapterList();
      });

      document.getElementById('in-confirm').addEventListener('click', async () => {
        const title = document.getElementById('in-title').value.trim();
        const author = document.getElementById('in-author').value.trim();
        const sourceLang = document.getElementById('in-lang').value;
        if (!title || !author) return alert('Title and author required');

        const includes = [...document.querySelectorAll('#chapter-list li')].map(li => ({
          i: parseInt(li.dataset.i),
          include: li.querySelector('.ch-include').checked,
          title: li.querySelector('.ch-title').value.trim()
        }));

        const kept = includes.filter(x => x.include).map(x => ({ ...detectedChapters[x.i], title: x.title }));

        const book = await Storage.books.put({
          title, author, sourceLang,
          createdAt: Date.now(),
          chapterCount: kept.length,
          glossary: [],
          narratorVoice: 'narrator'
        });
        for (let i = 0; i < kept.length; i++) {
          const c = kept[i];
          await Storage.chapters.put({
            bookId: book.id,
            index: i,
            title: c.title,
            sourceText: c.sourceText,
            versions: { [sourceLang]: c.sourceText },
            positionFraction: 0,
            playbackResume: null,
            voiced: {}
          });
        }
        nav('library');
      });
    });

    // ============ Book detail screen ============
    route('book', async (el, { id }) => {
      const book = await Storage.books.get(id);
      const chs = await Storage.chapters.list(id);
      el.innerHTML = `
        <header class="topbar">
          <button id="btn-back-library">&#8592;</button>
          <div>
            <h1>${escapeHtml(book.title)}</h1>
            <p class="author">${escapeHtml(book.author || '')}</p>
          </div>
        </header>
        <main class="book-detail">
          <ol class="chapters">
            ${chs.map(c => {
              const chips = [];
              chips.push(escapeHtml(book.sourceLang.toUpperCase()));
              if (c.versions?.es && Object.keys(c.versions.es).length) chips.push('ES');
              if (Object.values(c.voiced || {}).some(v => v)) chips.push('&#9205;');
              if (c.positionFraction > 0.02) chips.push(Math.round(c.positionFraction * 100) + '%');
              return `<li data-cid="${escapeHtml(c.id)}"><span class="ch-idx">${c.index + 1}</span><span class="ch-title">${escapeHtml(c.title)}</span><span class="chips">${chips.map(x => `<span class="chip">${x}</span>`).join('')}</span></li>`;
            }).join('')}
          </ol>
        </main>`;
      el.querySelector('#btn-back-library').addEventListener('click', () => nav('library'));
      el.querySelectorAll('li[data-cid]').forEach(li =>
        li.addEventListener('click', () => nav('reader', { chapterId: li.dataset.cid }))
      );
    });

    // ============ Spanish generator ============
    async function generateSpanish(chapter, book, level, onProgress) {
      const source = chapter.sourceText || chapter.versions?.[book.sourceLang];
      if (!source) throw new Error('no source text');
      const paras = splitParagraphs(source);
      const out = [];
      for (let i = 0; i < paras.length; i++) {
        onProgress?.(i, paras.length);
        const r = await fetch('/api/llm', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            task: 'translate_chunk',
            input: {
              text: paras[i],
              targetLang: 'es',
              level,
              prevContext: paras[i-1] || undefined,
              nextContext: paras[i+1] || undefined
            },
            glossary: book.glossary || [],
            bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
          })
        });
        if (!r.ok) {
          let msg;
          try { const j = await r.json(); msg = j.error || `HTTP ${r.status}`; }
          catch { msg = `HTTP ${r.status} (non-JSON body)`; }
          throw new Error(`translate failed at para ${i}: ${msg}`);
        }
        let j;
        try { j = await r.json(); }
        catch { throw new Error(`translate failed at para ${i}: response not JSON`); }
        if (!j.result || typeof j.result.text !== 'string') {
          throw new Error(`translate failed at para ${i}: unexpected response shape`);
        }
        out.push(j.result.text);
      }
      onProgress?.(paras.length, paras.length);
      // Persist
      const updated = await Storage.chapters.get(chapter.id);
      updated.versions = updated.versions || {};
      updated.versions.es = { ...(updated.versions.es || {}), [level]: out.join('\n\n') };
      await Storage.chapters.put({ ...updated, sourceText: source });
      return updated.versions.es[level];
    }

    // ============ Reader screen ============
    function renderSentence(s, i) {
      const parts = s.split(/(\s+)/); // preserve whitespace
      const wrapped = parts.map(p => /^\s+$/.test(p) ? p : `<span class="w">${escapeHtml(p)}</span>`).join('');
      return `<span class="sent" data-sent="${i}">${wrapped}</span>`;
    }

    route('reader', async (el, { chapterId }) => {
      const readerAbort = new AbortController();
      _currentRouteAbort = readerAbort;

      const ch = await Storage.chapters.get(chapterId);
      const book = await Storage.books.get(ch.bookId);
      const displayLang = await Storage.settings.get('displayLang:' + book.id, book.sourceLang);
      const level = await Storage.settings.get('level:' + book.id, 'B1');

      // Pick text body
      let body;
      if (displayLang === 'es') body = ch.versions?.es?.[level] || null;
      else body = ch.versions?.[displayLang] || null;

      el.innerHTML = `
        <header class="topbar reader-topbar">
          <button id="btn-back-book">&#8592;</button>
          <div class="crumbs">${escapeHtml(book.title)} &middot; ${escapeHtml(ch.title)}</div>
          <div class="pills lang-pills">
            ${['ru','en','es'].map(l => `<button data-lang="${l}" class="pill${l === displayLang ? ' active' : ''}">${l.toUpperCase()}</button>`).join('')}
          </div>
          <div class="pills level-pills"${displayLang === 'es' ? '' : ' hidden'}>
            ${['A2','B1','B2','C1'].map(lv => `<button data-level="${lv}" class="pill${lv === level ? ' active' : ''}">${lv}</button>`).join('')}
          </div>
          <button class="play-btn" disabled title="Not yet implemented">&#9654;</button>
        </header>
        <main class="reader">
          ${body
            ? splitParagraphs(body).map(p =>
                `<p>${splitSentences(p).map(renderSentence).join(' ')}</p>`
              ).join('')
            : `<div class="empty"><p>No text for <b>${escapeHtml(displayLang)}${displayLang === 'es' ? ' ' + escapeHtml(level) : ''}</b> yet.</p>
               ${displayLang === 'es'
                 ? `<button id="btn-generate">Generate ES ${escapeHtml(level)}</button><div id="gen-progress"></div>`
                 : `<p><i>Only Spanish generation is supported. Import an English or Russian version manually if needed.</i></p>`}</div>`}
          <div id="popover" hidden></div>
        </main>`;

      el.querySelector('#btn-back-book').addEventListener('click', () => nav('book', { id: book.id }));
      el.querySelectorAll('.lang-pills .pill').forEach(p => p.addEventListener('click', async () => {
        await Storage.settings.set('displayLang:' + book.id, p.dataset.lang);
        nav('reader', { chapterId });
      }));
      el.querySelectorAll('.level-pills .pill').forEach(p => p.addEventListener('click', async () => {
        await Storage.settings.set('level:' + book.id, p.dataset.level);
        nav('reader', { chapterId });
      }));

      document.getElementById('btn-generate')?.addEventListener('click', async (e) => {
        e.target.disabled = true;
        const prog = document.getElementById('gen-progress');
        try {
          await generateSpanish(ch, book, level, (done, total) => {
            prog.textContent = `Translating paragraph ${done} / ${total}...`;
          });
          nav('reader', { chapterId });
        } catch (err) {
          prog.textContent = 'Error: ' + escapeHtml(err.message);
          e.target.disabled = false;
        }
      });

      // ---- Tap-to-gloss ----
      const pop = document.getElementById('popover');
      if (pop) {
        el.querySelector('main.reader').addEventListener('click', async (e) => {
          const w = e.target.closest('.w');
          if (!w) { pop.hidden = true; return; }
          const sent = w.closest('.sent');
          const word = w.textContent.replace(/[.,;:!?¡¿"'()\[\]«»—–…]/g, '').trim();
          if (!word) return;
          const sentence = sent.textContent.trim();
          pop.hidden = false;
          pop.innerHTML = `<div class="pop-loading">Looking up &#8220;${escapeHtml(word)}&#8221;&#8230;</div>`;
          const rect = w.getBoundingClientRect();
          pop.style.left = Math.max(8, Math.min(window.innerWidth - 320, rect.left)) + 'px';
          pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';

          try {
            const r = await fetch('/api/llm', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                task: 'gloss',
                input: { tappedWord: word, sentence, displayLang },
                glossary: book.glossary || [],
                bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
              })
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
            const g = j.result;
            pop.innerHTML = `
              <div class="pop-word"><b>${escapeHtml(g.word)}</b> <span class="pop-lemma">(${escapeHtml(g.lemma)})</span></div>
              <div class="pop-gloss">${escapeHtml(g.gloss)}</div>
              <div class="pop-note">${escapeHtml(g.note || '')}</div>
              <div class="pop-actions">
                <button id="pop-save">+ save</button>
                <button id="pop-close">&#10005;</button>
              </div>`;
            document.getElementById('pop-save').addEventListener('click', async () => {
              await Storage.vocab.put({
                word: g.word, lemma: g.lemma, gloss: g.gloss, sourceSentence: sentence,
                bookId: book.id, chapterId: ch.id, displayLangAtSave: displayLang, exported: false
              });
              if (!pop.hidden) {
                const btn = document.getElementById('pop-save');
                if (btn) btn.textContent = '✓ saved';
              }
            });
            document.getElementById('pop-close').addEventListener('click', () => { pop.hidden = true; });
          } catch (err) {
            pop.innerHTML = `<div class="pop-error">${escapeHtml(err.message)}</div>`;
          }
        });

        // Dismiss on scroll or outside click
        document.addEventListener('scroll', () => { pop.hidden = true; }, { passive: true, signal: readerAbort.signal });
        document.addEventListener('mousedown', (e) => {
          if (!pop.contains(e.target) && !e.target.closest('.w')) pop.hidden = true;
        }, { signal: readerAbort.signal });
      }

      // ---- Frank-style sentence breakdown on double-click ----
      el.querySelector('main.reader').addEventListener('dblclick', async (e) => {
        const sent = e.target.closest('.sent');
        if (!sent || sent.dataset.hasBreakdown) return;
        const sentence = sent.textContent.trim();
        const l1 = displayLang === 'es' ? (book.sourceLang === 'ru' ? 'ru' : 'en') : displayLang;
        const holder = document.createElement('div');
        holder.className = 'breakdown';
        holder.textContent = 'Loading breakdown...';
        sent.after(holder);
        sent.dataset.hasBreakdown = '1';

        try {
          const r = await fetch('/api/llm', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              task: 'breakdown',
              input: { sentence, displayLang, l1 },
              glossary: book.glossary || [],
              bookMeta: { title: book.title, author: book.author, sourceLang: book.sourceLang }
            })
          });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error);
          const b = j.result;
          holder.innerHTML = `
            <div class="bd-chunks">${b.chunks.map(c => `<span class="bd-ch"><span class="bd-t">${escapeHtml(c.text)}</span> <span class="bd-g">(${escapeHtml(c.gloss)})</span></span>`).join(' ')}</div>
            <div class="bd-clean">${escapeHtml(b.clean)}</div>
            <button class="bd-close">&#10005;</button>`;
          holder.querySelector('.bd-close').addEventListener('click', () => { holder.remove(); delete sent.dataset.hasBreakdown; });
        } catch (err) {
          holder.textContent = 'Error: ' + err.message;
        }
      });
    });

    // stubs so nav() doesn't throw before those screens exist
    route('vocab',    (el) => { el.innerHTML = '<div class="stub"><p>Vocab (stub)</p><button onclick="nav(\'library\')">&#8592; Back</button></div>'; });
    route('settings', (el) => { el.innerHTML = '<div class="stub"><p>Settings (stub)</p><button onclick="nav(\'library\')">&#8592; Back</button></div>'; });

    window.Storage = Storage;
    window.nav = nav;
    window.escapeHtml = escapeHtml;
    nav('library');
  </script>
</body>
</html>
